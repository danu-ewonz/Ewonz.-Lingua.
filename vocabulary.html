<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    background:#0b0b0b;
    font-family:Poppins;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    gap:10px;
}

/* ================= FRAME ================= */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#fff;
    margin-top:14px;
}

.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
}

.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* ================= SCROLL FIX (ONLY IMPORTANT CHANGE) ================= */
.content{
    position:absolute;
    top:90px;
    bottom:0;
    left:0;
    right:0;
    overflow-y:auto;
    padding:12px;
}

/* BUTTON */
.btn{
    padding:12px;
    margin-bottom:8px;
    background:#111;
    border:1px solid rgba(184,134,11,0.5);
    border-radius:10px;
    text-align:center;
}

.btn .jp{
    color:#fff;
    font-weight:600;
    font-size:13px;
}

.btn .si{
    color:#b8860b;
    font-size:11px;
    margin-top:2px;
}

/* UNDERLINE */
.btn::after{
    content:"";
    display:block;
    width:60%;
    height:1px;
    margin:6px auto 0;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* ================= OUTSIDE BACK HOME (UNCHANGED) ================= */
.bottom-nav{
    width:360px;
    height:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:#0a0a0a;
    border-radius:12px;
    border:1px solid rgba(255,215,0,0.15);
}

/* BUTTONS */
.nav-btn{
    flex:1;
    text-align:center;
    color:#ff3b3b;
    font-size:13px;
    font-weight:700;
    padding:6px;
    border-radius:8px;
    border:1px solid rgba(255,0,0,0.2);
}

.nav-btn:active{
    background:#ff3b3b;
    color:#000;
}

/* CENTER */
.nav-center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-size:12px;
    font-weight:700;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<!-- FRAME -->
<div class="frame">

<div class="title">VOCABULARY</div>
<div class="subtitle">語彙</div>
<div class="line"></div>

<!-- SCROLL CONTENT -->
<div class="content">

<div class="btn">
    <div class="jp">People & Aisatsu (人々)</div>
    <div class="si">මිනිසුන් සහා ආචාර ක්‍රම</div>
</div>

<div class="btn">
    <div class="jp">Home & Living (住まい)</div>
    <div class="si">නිවස සහ ජීවිතය</div>
</div>

<div class="btn">
    <div class="jp">Food & Drinks (食べ物)</div>
    <div class="si">ආහාර සහ බීම</div>
</div>

<div class="btn">
    <div class="jp">Transportation (交通)</div>
    <div class="si">ප්‍රවාහනය</div>
</div>

<div class="btn">
    <div class="jp">Animals (動物)</div>
    <div class="si">සතුන්</div>
</div>

<div class="btn">
    <div class="jp">School (学校)</div>
    <div class="si">පාසල</div>
</div>

</div>
</div>

<!-- BACK HOME (NO CHANGE) -->
<div class="bottom-nav">

<div class="nav-btn" onclick="history.back()">BACK</div>

<div class="nav-center">← EWONZ LINGUA →</div>

<div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</body>
</html>
