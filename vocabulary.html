<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary - Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    background:#0b0b0b;
    font-family:'Poppins', sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    gap:10px;
}

/* =========================
FRAME (3:4 BOX)
========================= */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;
}

/* INNER BACKGROUND */
.frame::after{
    content:"";
    position:absolute;
    inset:2px;
    background:#0a0a0a;
    border-radius:18px;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100%;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#e6e6e6;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* =========================
SCROLL AREA
========================= */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:14px;
    border-radius:10px;
    background:#111;
    color:#fff;

    font-family:'Montserrat', sans-serif;
    font-size:12px;
    font-weight:600;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:1px;

    border:2px solid #b8860b;
    cursor:pointer;
    transition:0.2s;
}

.btn:active{
    background:#b8860b;
    color:#000;
    transform:scale(0.98);
}

/* SCROLLBAR */
.grid::-webkit-scrollbar{
    width:3px;
}

.grid::-webkit-scrollbar-thumb{
    background:#b8860b;
    border-radius:10px;
}

/* =========================
OUTSIDE NAV (FINAL)
========================= */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);
}

/* ALL ITEMS */
.nav-item,
.nav-center{
    flex:1;
    text-align:center;

    font-weight:700;
    letter-spacing:1px;
    white-space:nowrap;
}

/* SIDE BUTTONS */
.nav-item{
    color:#ff3b3b;
    font-size:13px;
    cursor:pointer;
    transition:0.2s;
}

/* CENTER TEXT */
.nav-center{
    color:#ffd700;
    font-size:12px;
}

/* TOUCH EFFECT */
.nav-item:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* BORDER ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<!-- FRAME -->
<div class="frame">

<div class="content">

    <div class="title">VOCABULARY</div>
    <div class="line"></div>

    <!-- SCROLL BUTTONS -->
    <div class="grid">

        <div class="btn">Greetings & Aisatsu</div>
        <div class="btn">People & Relationships</div>
        <div class="btn">Home & Living</div>
        <div class="btn">Food & Drinks</div>
        <div class="btn">Daily Activities</div>
        <div class="btn">Time & Calendar</div>
        <div class="btn">Numbers</div>
        <div class="btn">Colors</div>
        <div class="btn">Clothing</div>
        <div class="btn">Transportation</div>
        <div class="btn">Weather</div>
        <div class="btn">Animals</div>
        <div class="btn">School</div>

    </div>

</div>

</div>

<!-- OUTSIDE NAV -->
<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">
        BACK
    </div>

    <div class="nav-center">
        ← EWONZ LINGUA →
    </div>

    <div class="nav-item" onclick="location.href='index.html'">
        HOME
    </div>

</div>

</body>
</html>
