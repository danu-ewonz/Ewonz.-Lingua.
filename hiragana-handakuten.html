<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Handakuten Hiragana</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
}

body{
background:#0b0b0b;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Poppins;
gap:10px;
}

/* FRAME */
.frame{
width:360px;
height:480px;
background:#0a0a0a;
border-radius:20px;
position:relative;
overflow:hidden;
}

/* BORDER */
.frame::before{
content:"";
position:absolute;
inset:0;
padding:2px;
border-radius:20px;
background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
background-size:300% 100%;
animation:shine 3s linear infinite;

-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
}

/* TITLE */
.title{
text-align:center;
color:#fff;
font-size:18px;
font-weight:700;
padding-top:12px;
}

/* LINE */
.line{
width:85%;
height:2px;
margin:6px auto;
background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* SCROLL */
.scroll{
position:absolute;
top:70px;
bottom:0;
left:0;
right:0;
overflow-y:auto;
padding:10px;
}

/* GROUP */
.group{
text-align:center;
color:#ffd700;
font-size:12px;
font-weight:700;
margin:12px 0;
}

/* ROW */
.row{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
padding:10px;
border-bottom:1px solid rgba(255,215,0,0.12);
}

/* BOX */
.box{
background:#111;
border:1px solid #b8860b;
border-radius:8px;
padding:10px 14px;
min-width:70px;
text-align:center;
color:#fff;
font-size:16px;
font-weight:700;
}

/* ROMAJI */
.romaji{
font-size:10px;
color:#aaa;
margin-top:3px;
}

/* STACK */
.stack{
display:flex;
flex-direction:column;
align-items:center;
}

/* ARROW */
.arrow{
color:#ffd700;
font-weight:800;
font-size:16px;
}

/* NAV */
.bottom-nav{
width:360px;
height:55px;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:0 15px;
background:#0a0a0a;
border-radius:12px;
border:1px solid rgba(255,215,0,0.15);
}

.nav-left,.nav-right{
text-align:center;
color:red;
font-weight:700;
font-size:13px;
cursor:pointer;
}

.nav-center{
text-align:center;
color:#ffd700;
font-weight:700;
font-size:12px;
}

.nav-left:active,.nav-right:active{
transform:scale(0.95);
color:#ffd700;
}

/* ANIMATION */
@keyframes shine{
0%{background-position:0%;}
100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">HANDAKUTEN (゜)</div>
<div class="line"></div>

<div class="scroll">

<div class="group">H → P ONLY</div>

<div class="row">
  <div class="stack">
    <div class="box">は</div>
    <div class="romaji">ha</div>
  </div>

  <div class="arrow">→</div>

  <div class="stack">
    <div class="box">ぱ</div>
    <div class="romaji">pa</div>
  </div>
</div>

<div class="row">
  <div class="stack">
    <div class="box">ひ</div>
    <div class="romaji">hi</div>
  </div>

  <div class="arrow">→</div>

  <div class="stack">
    <div class="box">ぴ</div>
    <div class="romaji">pi</div>
  </div>
</div>

<div class="row">
  <div class="stack">
    <div class="box">ふ</div>
    <div class="romaji">fu</div>
  </div>

  <div class="arrow">→</div>

  <div class="stack">
    <div class="box">ぷ</div>
    <div class="romaji">pu</div>
  </div>
</div>

<div class="row">
  <div class="stack">
    <div class="box">へ</div>
    <div class="romaji">he</div>
  </div>

  <div class="arrow">→</div>

  <div class="stack">
    <div class="box">ぺ</div>
    <div class="romaji">pe</div>
  </div>
</div>

<div class="row">
  <div class="stack">
    <div class="box">ほ</div>
    <div class="romaji">ho</div>
  </div>

  <div class="arrow">→</div>

  <div class="stack">
    <div class="box">ぽ</div>
    <div class="romaji">po</div>
  </div>
</div>

</div>

</div>

<!-- NAV -->
<div class="bottom-nav">

<div class="nav-left" onclick="history.back()">BACK</div>

<div class="nav-center">← EWONZ LINGUA →</div>

<div class="nav-right" onclick="location.href='index.html'">HOME</div>

</div>

</body>
</html>
