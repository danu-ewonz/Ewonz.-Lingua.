<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Learning</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

/* BODY */
body{
    font-family:'Poppins', sans-serif;
    background:url("1781102623679_edit_59706522898481.png") no-repeat center center;
    background-size:cover;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* FRAME */
.frame{
    width:360px;
    aspect-ratio:9/16;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:url("1781102623679_edit_59706522898481.png") no-repeat center center;
    background-size:cover;
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(10,10,10,0.65);
    z-index:0;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
    z-index:2;
}

/* CONTENT */
.title, .title-line, .grid, .bottom-nav{
    position:relative;
    z-index:3;
}

/* TITLE */
.title{
    text-align:center;
    font-size:22px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
}

/* LINE */
.title-line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:18px;
    flex:1;
}

/* BUTTON */
.btn{
    padding:14px;
    border-radius:10px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    font-family:'Montserrat', sans-serif;
    font-size:16px;
    font-weight:700;
    text-align:center;
    border:2px solid #b8860b;
    cursor:pointer;
}

/* LOCK */
.locked{
    opacity:0.6;
    position:relative;
}

.lock-tag{
    position:absolute;
    right:10px;
    top:8px;
    font-size:9px;
    background:red;
    color:white;
    padding:2px 6px;
    border-radius:4px;
    font-weight:700;
}

/* NAV */
.bottom-nav{
    width:100%;
    height:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.2);
}

/* BUTTONS */
.nav-btn{
    flex:1;
    text-align:center;
    font-weight:700;
    font-size:12px;

    background:transparent;
    border:none;
    color:#ff3b3b;

    cursor:pointer;
}

/* CENTER SINGLE LINE */
.nav-center{
    flex:2;
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:#ffd700;

    white-space:nowrap;
}

/* ACTIVE */
.nav-btn:active{
    color:#ffd700;
    transform:scale(0.97);
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:300px;
    background:rgba(0,0,0,0.95);
    border:2px solid #ffd700;
    border-radius:14px;
    padding:16px;
    text-align:center;
    color:#fff;
    z-index:9999;
    display:none;
}

.popup h2{
    font-size:16px;
    color:#ffd700;
    margin-bottom:6px;
}

.popup-lang{
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
}

.popup-date{
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
}

.countdown{
    font-size:14px;
    font-weight:700;
    margin-bottom:12px;
}

.popup button{
    padding:6px 12px;
    border:none;
    background:#ff3b3b;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">LANGUAGE LEARNING</div>
<div class="title-line"></div>

<div class="grid">

    <div class="btn" onclick="location.href='japanese-index.html'">
        Japanese Language 🇯🇵
    </div>

    <div class="btn locked" onclick="openPopup('Chinese Language 🇨🇳')">
        Chinese Language 🇨🇳
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="openPopup('Korean Language 🇰🇷')">
        Korean Language 🇰🇷
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="openPopup('French Language 🇫🇷')">
        French Language 🇫🇷
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="openPopup('German Language 🇩🇪')">
        German Language 🇩🇪
        <div class="lock-tag">LOCK</div>
    </div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <button class="nav-btn" onclick="goBack()">BACK</button>

    <div class="nav-center">
        ← EWONZ LINGUA →
    </div>

    <button class="nav-btn" onclick="goHome()">HOME</button>

</div>

</div>

<!-- POPUP -->
<div id="popup" class="popup">

    <h2>Coming Soon</h2>

    <div id="popupLang" class="popup-lang">Language</div>

    <div class="popup-date">2026 / 11 / 28</div>

    <div class="countdown" id="countdown">Loading...</div>

    <button onclick="closePopup()">Close</button>

</div>

<script>

let timer;
const targetDate = new Date("2026-11-28T00:00:00").getTime();

/* BACK */
function goBack(){
    if(history.length > 1){
        history.back();
    } else {
        location.href = "index.html";
    }
}

/* HOME */
function goHome(){
    location.href = "index.html";
}

/* POPUP */
function openPopup(lang){
    document.getElementById("popup").style.display = "block";
    document.getElementById("popupLang").innerText = lang;

    updateCountdown();

    clearInterval(timer);
    timer = setInterval(updateCountdown, 1000);
}

/* COUNTDOWN */
function updateCountdown(){
    const now = new Date().getTime();
    const diff = targetDate - now;

    if(diff <= 0){
        document.getElementById("countdown").innerHTML = "NOW AVAILABLE 🎉";
        clearInterval(timer);
        return;
    }

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    const m = Math.floor((diff%(1000*60*60))/(1000*60));
    const s = Math.floor((diff%(1000*60))/1000);

    document.getElementById("countdown").innerHTML =
        `${d}d ${h}h ${m}m ${s}s`;
}

/* CLOSE */
function closePopup(){
    document.getElementById("popup").style.display = "none";
    clearInterval(timer);
}

</script>

</body>
</html>
