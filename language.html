<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Learning</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background: radial-gradient(circle at top left, #1a1a1a, #000000 60%);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* FRAME - CLEAN GOLD BORDER FIX */
.frame{
    width:360px;
    height:480px;

    /* 🔥 SHARP GOLD BORDER */
    border:2px solid #c9a86a;

    border-radius:20px;
    background:#0a0a0a;

    /* 🔥 REDUCED GLOW (FIXED) */
    box-shadow:0 0 8px rgba(201,168,106,0.25);

    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#e6e6e6;
    margin-top:18px;
    letter-spacing:2px;
}

/* GOLD LINES */
.title-line,
.nav-line{
    width:100%;
    height:1px;
    background:#c9a86a;
    opacity:0.9;
}

/* GRID */
.grid{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:15px;
    margin-top:10px;
    flex:1;
}

/* BUTTON */
.btn{
    padding:12px;
    border:1px solid #c9a86a;
    border-radius:10px;
    background:rgba(0,0,0,0.4);
    color:#fff;
    font-weight:600;
    font-size:14px;
    text-align:center;
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    box-shadow:0 0 10px rgba(201,168,106,0.6);
    transform:scale(1.02);
}

/* LOCK */
.locked{
    position:relative;
    opacity:0.7;
}

.lock-tag{
    position:absolute;
    right:10px;
    top:8px;
    font-size:9px;
    background:red;
    color:white;
    padding:2px 6px;
    border-radius:4px;
    font-weight:700;
}

/* NAV */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:12px 15px;
}

.nav-btn{
    color:#b22222;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-box{
    background:#111;
    border:1px solid #c9a86a;
    padding:20px;
    border-radius:10px;
    text-align:center;
    width:290px;
}

.countdown{
    margin-top:10px;
    color:#c9a86a;
    font-weight:700;
}
</style>
</head>

<body>

<div class="frame">

<!-- TITLE -->
<div class="title">LANGUAGE LEARNING</div>

<div class="title-line"></div>

<!-- BUTTONS -->
<div class="grid">

    <div class="btn" onclick="openLang('japanese/index.html')">
        Japanese Language 🇯🇵
    </div>

    <div class="btn locked" onclick="showPopup()">
        Chinese Language 🇨🇳
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="showPopup()">
        Korean Language 🇰🇷
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="showPopup()">
        Russian Language 🇷🇺
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="showPopup()">
        French Language 🇫🇷
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="showPopup()">
        German Language 🇩🇪
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked" onclick="showPopup()">
        Italian Language 🇮🇹
        <div class="lock-tag">LOCK</div>
    </div>

</div>

<div class="nav-line"></div>

<!-- NAV -->
<div class="navbar">
    <div class="nav-btn" onclick="goBack()">← Back</div>
    <div class="nav-btn" onclick="goHome()">Home →</div>
</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-box">
        <h3 style="color:white;">Coming Soon</h3>
        <p style="color:white;">2026.11.28</p>

        <div id="countdown" class="countdown"></div>

        <br>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<script>
function openLang(url){
    window.location.href = url;
}

function goBack(){
    window.history.back();
}

function goHome(){
    window.location.href = "index.html";
}

let countdownStarted = false;

function showPopup(){
    document.getElementById("popup").style.display = "flex";

    if(!countdownStarted){
        startCountdown();
        countdownStarted = true;
    }
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function startCountdown(){
    let target = new Date("2026-11-28T00:00:00").getTime();

    setInterval(function(){
        let now = new Date().getTime();
        let diff = target - now;

        let d = Math.floor(diff / (1000*60*60*24));
        let h = Math.floor((diff % (1000*60*60*24))/(1000*60*60));
        let m = Math.floor((diff % (1000*60*60))/(1000*60));
        let s = Math.floor((diff % (1000*60))/1000);

        document.getElementById("countdown").innerHTML =
            d+"d : "+h+"h : "+m+"m : "+s+"s";
    },1000);
}
</script>

</body>
</html>
