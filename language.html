<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Language Learning</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

/* BODY */
body{
    font-family:'Poppins', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;

    /* ✅ BACKGROUND ONLY INSIDE FRAME */
    background:url("1781102623679_edit_59706522898481.png") no-repeat center center;
    background-size:cover;
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(10,10,10,0.65);
    z-index:0;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    pointer-events:none;
    z-index:2;
}

/* CONTENT */
.content{
    position:relative;
    z-index:3;
    flex:1;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#fff;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    border-radius:10px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    font-family:'Montserrat', sans-serif;
    font-size:16px;
    font-weight:700;
    text-align:center;
    border:2px solid #b8860b;
    cursor:pointer;
}

/* LOCK */
.locked{
    opacity:0.6;
    position:relative;
}

.lock-tag{
    position:absolute;
    right:10px;
    top:8px;
    font-size:10px;
    background:red;
    color:white;
    padding:2px 6px;
    border-radius:4px;
}

/* NAV (INSIDE FRAME) */
.bottom-nav{
    position:relative;
    z-index:3;

    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.2);
}

/* NAV BUTTONS */
.nav-btn{
    flex:1;
    text-align:center;
    font-weight:700;
    font-size:13px;
    color:#ff3b3b;
    cursor:pointer;
}

/* CENTER */
.nav-center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-size:12px;
    font-weight:700;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

    <div class="content">

        <div class="title">LANGUAGE LEARNING</div>

        <div class="btn" onclick="location.href='japanese-index.html'">
            Japanese Language 🇯🇵
        </div>

        <div class="btn locked">
            Chinese Language 🇨🇳
            <div class="lock-tag">LOCK</div>
        </div>

        <div class="btn locked">
            Korean Language 🇰🇷
            <div class="lock-tag">LOCK</div>
        </div>

        <div class="btn locked">
            French Language 🇫🇷
            <div class="lock-tag">LOCK</div>
        </div>

        <div class="btn locked">
            German Language 🇩🇪
            <div class="lock-tag">LOCK</div>
        </div>

    </div>

    <!-- NAV -->
    <div class="bottom-nav">

        <div class="nav-btn" onclick="goBack()">BACK</div>

        <div class="nav-center">← EWONZ LINGUA →</div>

        <div class="nav-btn" onclick="goHome()">HOME</div>

    </div>

</div>

<script>
function goBack(){
    window.history.back();
}

function goHome(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
