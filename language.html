<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Learning</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:12px;
}

/* ================= FRAME ================= */
.frame{
    width:360px;
    height:480px;
    border-radius:20px;
    background:#0a0a0a;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER SHINE */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(
        90deg,
        #b8860b,
        #ffd700,
        #b8860b,
        #8b6508,
        #ffd700,
        #b8860b
    );

    background-size:300% 100%;
    animation:shineMove 3s linear infinite;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#e6e6e6;
    margin-top:18px;
    letter-spacing:2px;
}

/* LINES */
.title-line,
.nav-line{
    width:100%;
    height:2px;
    position:relative;
    overflow:hidden;
    background:#1e1e1e;
}

.title-line::before,
.nav-line::before{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:60%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        #b8860b,
        #ffd700,
        #b8860b,
        transparent
    );

    animation:lineMove 3s linear infinite;
}

/* GRID */
.grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
    margin-top:10px;
    flex:1;
}

/* BUTTON */
.btn{
    position:relative;
    overflow:hidden;

    padding:12px;
    border-radius:10px;
    background:#111;

    color:#fff;
    font-weight:600;
    font-size:14px;
    text-align:center;
    cursor:pointer;

    border:2px solid #b8860b;
}

/* LOCK */
.locked{
    opacity:0.7;
    position:relative;
}

.lock-tag{
    position:absolute;
    right:10px;
    top:8px;
    font-size:9px;
    background:red;
    color:white;
    padding:2px 6px;
    border-radius:4px;
    font-weight:700;
}

/* ================= OUTSIDE NAV (ANDROID CLEAN) ================= */
.outside-nav{
    width:360px;
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

/* CLEAN TEXT BUTTONS (NO BORDER) */
.out-btn{
    width:48%;
    padding:10px;
    text-align:center;
    font-weight:700;
    font-size:13px;
    color:red;

    background:transparent;
    border:none;

    cursor:pointer;
    transition:0.2s;
}

.out-btn:hover{
    color:#ff4d4d;
    transform:scale(1.05);
}

/* ANIMATIONS */
@keyframes shineMove{
    0%{ background-position:0% 50%; }
    100%{ background-position:100% 50%; }
}

@keyframes lineMove{
    0%{ left:-60%; }
    100%{ left:160%; }
}

</style>
</head>

<body>

<div class="frame">

<div class="title">LANGUAGE LEARNING</div>

<div class="title-line"></div>

<div class="grid">

    <div class="btn">Japanese Language 🇯🇵</div>

    <div class="btn locked">
        Chinese Language 🇨🇳
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked">
        Korean Language 🇰🇷
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked">
        Russian Language 🇷🇺
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked">
        French Language 🇫🇷
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked">
        German Language 🇩🇪
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn locked">
        Italian Language 🇮🇹
        <div class="lock-tag">LOCK</div>
    </div>

</div>

<div class="nav-line"></div>

</div>

<!-- OUTSIDE NAV BUTTONS -->
<div class="outside-nav">

    <div class="out-btn" onclick="goBack()">← Back</div>
    <div class="out-btn" onclick="goHome()">Home →</div>

</div>

<script>

function goBack(){
    window.history.back();
}

function goHome(){
    window.location.href = "index.html";
}

</script>

</body>
</html>
