<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hiragana Special</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

/* BODY */
body{
    background:#0b0b0b;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Poppins;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;

    border-radius:20px;

    background:url("1781342600371_edit_120941683763823.png") center/cover no-repeat;

    border:2px solid rgba(255,215,0,0.25);
}

/* GOLD BORDER FIX (MORE STABLE) */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:2px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    pointer-events:none;

    /* border visibility fix */
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;

    z-index:2;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0% 0%;}
    100%{background-position:300% 0%;}
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:15px;
    z-index:1;
}

.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
    z-index:1;
}

/* CONTENT */
.content{
    flex:1;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:1;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    border:2px solid #b8860b;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:16px;
    font-weight:700;

    cursor:pointer;

    /* IMPORTANT: keep background image visible */
    background:rgba(0,0,0,0.25);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:0.25s;

    position:relative;
    overflow:hidden;
}

/* CLICK EFFECT */
.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

/* LOCKED */
.locked{
    opacity:0.75;
}

/* LOCK TAG */
.lock-tag{
    position:absolute;
    right:10px;
    top:8px;
    background:red;
    color:#fff;
    font-size:10px;
    padding:2px 6px;
    border-radius:5px;
}

/* NAV */
.bottom-nav{
    height:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;

    background:#000;
    border-top:1px solid rgba(255,215,0,0.2);

    z-index:5;
}

/* NAV BUTTONS */
.nav-btn{
    flex:1;
    text-align:center;
    color:red;
    font-weight:700;
    cursor:pointer;
}

.center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:12px;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:280px;

    background:#000;
    border:2px solid #ffd700;
    border-radius:12px;

    padding:15px;
    text-align:center;
    color:#fff;

    display:none;
    z-index:9999;
}

.popup h2{
    color:#ffd700;
    font-size:16px;
}

.countdown{
    margin-top:10px;
    font-weight:700;
}

.close{
    margin-top:12px;
    background:red;
    border:none;
    color:#fff;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="frame">

<div class="title">HIRAGANA SPECIAL</div>
<div class="line"></div>

<div class="content">

    <div class="btn" onclick="location.href='hiragana-dakuten.html'">Dakuten</div>
    <div class="btn" onclick="location.href='hiragana-handakuten.html'">Handakuten</div>
    <div class="btn" onclick="location.href='hiragana-yoon.html'">Yōon</div>
    <div class="btn" onclick="location.href='hiragana-sokuon.html'">Sokuon</div>

    <div class="btn locked" onclick="openPopup()">
        Special Practice
        <div class="lock-tag">LOCK</div>
    </div>

</div>

<!-- NAV -->
<div class="bottom-nav">
    <div class="nav-btn" onclick="history.back()">BACK</div>
    <div class="center">← EWONZ LINGUA →</div>
    <div class="nav-btn" onclick="location.href='index.html'">HOME</div>
</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <h2>Coming Soon</h2>
    <div>Release: 2026 / 11 / 28</div>
    <div class="countdown" id="countdown"></div>
    <button class="close" onclick="closePopup()">Close</button>
</div>

<script>

const targetDate = new Date("2026-11-28").getTime();

function openPopup(){
    document.getElementById("popup").style.display="block";
    updateCountdown();
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

/* LIVE COUNTDOWN FIX */
function updateCountdown(){
    let now = new Date().getTime();
    let diff = targetDate - now;

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));

    if(days < 0) days = 0;

    document.getElementById("countdown").innerText =
        days + " Days left";
}

/* auto update every 1 sec */
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
