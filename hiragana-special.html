<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hiragana Special</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

/* BODY */
body{
    background:#0b0b0b;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Poppins;
}

/* WRAPPER */
.wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;
    background:#0a0a0a;
    border-radius:20px;

    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:15px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* CONTENT */
.content{
    flex:1;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* 🔥 SMALL 9:4 BUTTON */
.btn{
    width:100%;
    aspect-ratio: 9 / 4;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#111;
    color:#fff;

    border:2px solid #b8860b;
    border-radius:10px;

    font-size:12px;
    font-weight:600;

    text-transform:uppercase;

    cursor:pointer;

    padding:4px 6px;

    max-height:65px;   /* 🔥 smaller size */
}

/* CLICK EFFECT */
.btn:active{
    background:linear-gradient(90deg,#ffd700,#b8860b);
    color:#000;
    transform:scale(0.97);
}

/* NAV (INSIDE FRAME) */
.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:#0a0a0a;
    border-top:2px solid rgba(255,215,0,0.3);
}

/* NAV ITEMS */
.nav-btn,
.center{
    flex:1;
    text-align:center;
    font-weight:700;
    font-size:13px;
    white-space:nowrap;
}

/* BACK / HOME */
.nav-btn{
    color:red;
    cursor:pointer;
}

/* CENTER TEXT */
.center{
    color:#ffd700;
    font-size:12px;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="wrapper">

<div class="frame">

    <div class="title">HIRAGANA SPECIAL 🇯🇵</div>
    <div class="line"></div>

    <div class="content">

        <div class="btn" onclick="location.href='hiragana-dakuten.html'">Dakuten</div>

        <div class="btn" onclick="location.href='hiragana-handakuten.html'">Handakuten</div>

        <div class="btn" onclick="location.href='hiragana-yoon.html'">Yōon</div>

        <div class="btn" onclick="location.href='hiragana-sokuon.html'">Sokuon</div>

        <div class="btn" onclick="location.href='hiragana-choon.html'">Chōon</div>

        <div class="btn" onclick="location.href='hiragana-particles.html'">Special Particle (は・へ・を)</div>

    </div>

    <!-- NAV INSIDE FRAME -->
    <div class="bottom-nav">

        <div class="nav-btn" onclick="history.back()">BACK</div>

        <div class="center">← EWONZ LINGUA →</div>

        <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

    </div>

</div>

</div>

</body>
</html>
