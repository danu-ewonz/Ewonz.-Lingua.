<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    background:#0b0b0b;
    font-family:Poppins;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;
    z-index:0;
}

.frame::after{
    content:"";
    position:absolute;
    inset:2px;
    background:#0a0a0a;
    border-radius:18px;
    z-index:1;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100%;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
    text-transform:uppercase;
}

/* SUBTITLE */
.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
    text-transform:uppercase;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:10px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* BUTTON AREA */
.grid{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:15px;
    background:#111;
    border:2px solid #b8860b;
    color:#fff;
    font-weight:600;
    font-size:13px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
    text-transform:uppercase;
}

.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

.btn:hover{
    border-color:#ffd700;
}

/* BOTTOM NAV */
.bottom-nav{
    width:360px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
}

.nav-btn{
    color:red;
    font-weight:700;
    cursor:pointer;
}

.nav-btn:hover{
    color:#ffd700;
}

.center{
    color:#ffd700;
    font-weight:700;
}

/* ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="content">

    <div class="title">EXAM</div>
    <div class="subtitle">SELECT EXAM TYPE</div>

    <div class="line"></div>

    <div class="grid">

        <!-- 🔥 FIXED LINKS -->
        <div class="btn" onclick="location.href='jlpt-exam.html'">JLPT EXAM</div>
        <div class="btn" onclick="location.href='nat-exam.html'">NAT-TEST EXAM</div>
        <div class="btn" onclick="location.href='jft-exam.html'">JFT-BASIC EXAM</div>
        <div class="btn" onclick="location.href='exam-features.html'">EXAM FEATURES</div>

    </div>

</div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">← BACK</div>

    <div class="center">EWONZ LINGUA</div>

    <div class="nav-btn" onclick="location.href='index.html'">HOME →</div>

</div>

</body>
</html>
