<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Exam Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

/* BODY CENTER */
body{
    background-color:black
    background-size:cover;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    font-family:Poppins,sans-serif;;
}

/* FRAME 9:16 FIXED */
.frame{
    width:360px;
    aspect-ratio:9/16;
    background:url("1781280463236_edit_59479765463083.png") center center no-repeat;
    background-size:cover;

    border-radius:20px;
    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    }
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    z-index:3;
    pointer-events:none;
}

/* SAFE CONTENT */
.content{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:2;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
    text-transform:uppercase;
}

/* SUBTITLE */
.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
    text-transform:uppercase;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
    }

/* GRID */
.grid{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:15px;
}

/* BUTTON */
.btn{
    .btn{
    padding:20px 14px;
    border-radius:10px;
    background:rgba(0,0,0,0.6);
    border:2px solid #b8860b;

    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-size:16px;
    font-weight:700;
    text-align: center;

    text-transform:uppercase;
    letter-spacing:1px;

    cursor:pointer;
    position:relative;
}

/* CLICK */
.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

/* ================= NAV FIXED ================= */
.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:#0a0a0a;
    border-top:2px solid rgba(255,215,0,0.2);

    flex-shrink:0;
}

/* NAV ITEMS */
.nav-btn{
    flex:1;
    text-align:center;

    color:#ff3b3b;
    font-size:13px;
    font-weight:700;

    cursor:pointer;
}

/* CENTER */
.center{
    flex:2;
    text-align:center;

    color:#ffd700;
    font-size:12px;
    font-weight:700;

    white-space:nowrap;
}

/* ACTIVE */
.nav-btn:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

</style>
</head>

<body>

<div class="frame">

    <div class="content">

        <div class="title">EXAM</div>
        <div class="subtitle">SELECT EXAM TYPE</div>

        <div class="line"></div>

        <div class="grid">

            <div class="btn" onclick="location.href='jlpt-exam.html'">JLPT EXAM</div>
            <div class="btn" onclick="location.href='nat-exam.html'">NAT-TEST EXAM</div>
            <div class="btn" onclick="location.href='jft-exam.html'">JFT-BASIC EXAM</div>
            <div class="btn" onclick="location.href='exam-features.html'">EXAM FEATURES</div>

        </div>

        <!-- NAV INSIDE FRAME (FIXED) -->
        <div class="bottom-nav">

            <div class="nav-btn" onclick="history.back()">BACK</div>

            <div class="center">← EWONZ LINGUA →</div>

            <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

        </div>

    </div>

</div>

</body>
</html>
