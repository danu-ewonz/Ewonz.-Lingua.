<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Exam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    background:#0b0b0b;
    font-family:Poppins;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;
    z-index:0;
}

.frame::after{
    content:"";
    position:absolute;
    inset:2px;
    background:#0a0a0a;
    border-radius:18px;
    z-index:1;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100%;
}

/* 🔥 TITLE (OLD STYLE WHITE) */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#ffffff;   /* WHITE FIX */
    margin-top:18px;
    letter-spacing:1px;
}

/* 🔥 SUB TITLE (CHANGED) */
.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
    font-weight:600;
    text-transform:uppercase;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:10px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* BUTTON AREA */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:15px;
    border-radius:10px;
    background:#111;
    color:#fff;

    font-size:13px;
    font-weight:600;

    display:flex;
    justify-content:center;
    align-items:center;

    border:2px solid #b8860b;
    cursor:pointer;
    transition:0.2s;
    text-transform:uppercase;
}

.btn:active{
    background:#b8860b;
    color:#000;
    transform:scale(0.98);
}

/* SCROLLBAR */
.grid::-webkit-scrollbar{
    width:3px;
}

.grid::-webkit-scrollbar-thumb{
    background:#b8860b;
}

/* =========================
BOTTOM NAV (NO BORDER LINE)
========================= */
.bottom-nav{
    width:360px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
}

/* 🔥 SIMPLE TEXT (NO BORDER) */
.nav-btn{
    color:red;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}

.nav-btn:hover{
    color:#ffd700;
}

/* CENTER */
.center{
    color:#b8860b;
    font-weight:700;
    letter-spacing:1px;
    font-size:13px;
}

/* ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

</style>
</head>

<body>

<!-- FRAME -->
<div class="frame">

<div class="content">

    <!-- FIXED TITLE -->
    <div class="title">Japanese Exam</div>

    <!-- FIXED SUBTITLE -->
    <div class="subtitle">Select Exam</div>

    <div class="line"></div>

    <!-- BUTTONS -->
    <div class="grid">

        <div class="btn">JLPT EXAM</div>
        <div class="btn">NAT-TEST EXAM</div>
        <div class="btn">JFT-BASIC EXAM</div>
        <div class="btn">EXAM FEATURES</div>

    </div>

</div>

</div>

<!-- OUTSIDE NAV (NO BORDER LINE) -->
<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">← BACK</div>

    <div class="center">EWONZ LINGUA</div>

    <div class="nav-btn" onclick="location.href='index.html'">HOME →</div>

</div>

</body>
</html>
