<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* 📱 9:16 PHONE FRAME */
.phone{
    width:360px;
    height:640px;
    border:2px solid #ffd700;
    border-radius:25px;
    overflow:hidden;
    background:#0a0a0a;
    box-shadow:0 0 20px #ffd700;
    position:relative;
}

/* CONTENT */
.content{
    padding:20px;
    text-align:center;
    color:white;
}

/* TITLE */
.title{
    font-size:24px;
    font-weight:bold;
    color:#ffd700;
    text-shadow:0 0 10px #ffd700, 0 0 20px #b8860b;
    margin-top:10px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
    margin-top:20px;
}

/* BUTTON */
.card{
    border:1px solid #ffd700;
    background:transparent;
    padding:16px;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    color:white;
    position:relative;
}

/* HOVER */
.card:hover{
    box-shadow:0 0 10px #ffd700;
    transform:scale(1.03);
}

/* LOCK TAG */
.lock{
    position:absolute;
    top:8px;
    right:10px;
    font-size:11px;
    background:red;
    padding:3px 6px;
    border-radius:6px;
}

/* SMALL */
.small{
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="phone">

    <div class="content">

        <!-- TITLE UPDATED -->
        <div class="title">
            Discover the world through language with Ewonz Lingua
        </div>

        <!-- BUTTONS -->
        <div class="grid">

            <!-- JAPANESE -->
            <div class="card" onclick="openPage('japanese/index.html')">
                🇯🇵 Japanese Language
                <div class="small">Start Learning</div>
            </div>

            <!-- CHINESE LOCKED -->
            <div class="card" onclick="locked()">
                <div class="lock">🔒 LOCK</div>
                🇨🇳 Chinese Language
                <div class="small">Coming Soon</div>
            </div>

            <!-- KOREAN LOCKED -->
            <div class="card" onclick="locked()">
                <div class="lock">🔒 LOCK</div>
                🇰🇷 Korean Language
                <div class="small">Coming Soon</div>
            </div>

            <!-- RUSSIAN LOCKED -->
            <div class="card" onclick="locked()">
                <div class="lock">🔒 LOCK</div>
                🇷🇺 Russian Language
                <div class="small">Coming Soon</div>
            </div>

        </div>

    </div>

</div>

<script>

function openPage(page){
    window.location.href = page;
}

/* LOCK ALERT + COUNTDOWN INSIDE MESSAGE */
function locked(){

    // countdown calculation
    let target = new Date("2026-11-28T00:00:00").getTime();
    let now = new Date().getTime();
    let diff = target - now;

    let days = Math.floor(diff / (1000*60*60*24));

    alert(
        "🔒 Coming Soon - 2026.11.28\n⏳ Time Left: " + days + " Days"
    );
}

</script>

</body>
</html>
