<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* 📱 9:16 FRAME */
.phone{
    width:360px;
    height:640px;
    border:2px solid #ffd700;
    border-radius:25px;
    overflow:hidden;
    background:#0a0a0a;
    box-shadow:0 0 20px #ffd700;
}

/* CONTENT */
.content{
    padding:20px;
    text-align:center;
    color:white;
}

/* TITLE */
.title{
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    text-shadow:0 0 10px #ffd700, 0 0 20px #b8860b;
    margin-top:15px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-top:25px;
}

/* BUTTON (SMALLER SIZE) */
.card{
    border:1px solid #ffd700;
    background:transparent;
    padding:10px;          /* reduced size */
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    color:white;
    font-size:14px;        /* smaller text */
}

/* HOVER */
.card:hover{
    box-shadow:0 0 8px #ffd700;
    transform:scale(1.02);
}

/* LOCK TAG */
.lock{
    position:absolute;
    top:6px;
    right:8px;
    font-size:10px;
    background:red;
    padding:2px 5px;
    border-radius:5px;
}

/* BUTTON WRAPPER */
.card-wrap{
    position:relative;
}
</style>
</head>

<body>

<div class="phone">

    <div class="content">

        <!-- TITLE UPDATED -->
        <div class="title">EWONZ LINGUA</div>

        <div class="grid">

            <!-- JAPANESE (OPEN) -->
            <div class="card" onclick="openPage('japanese/index.html')">
                Japanese Language 🇯🇵
            </div>

            <!-- CHINESE LOCKED -->
            <div class="card-wrap">
                <div class="lock">LOCK</div>
                <div class="card" onclick="locked()">
                    Chinese Language 🇨🇳
                </div>
            </div>

            <!-- KOREAN LOCKED -->
            <div class="card-wrap">
                <div class="lock">LOCK</div>
                <div class="card" onclick="locked()">
                    Korean Language 🇰🇷
                </div>
            </div>

            <!-- RUSSIAN LOCKED -->
            <div class="card-wrap">
                <div class="lock">LOCK</div>
                <div class="card" onclick="locked()">
                    Russian Language 🇷🇺
                </div>
            </div>

        </div>

    </div>

</div>

<script>

function openPage(page){
    window.location.href = page;
}

function locked(){
    let target = new Date("2026-11-28").getTime();
    let now = new Date().getTime();
    let diff = target - now;

    let days = Math.floor(diff / (1000*60*60*24));

    alert("🔒 Coming Soon - 2026.11.28\n⏳ " + days + " Days Left");
}

</script>

</body>
</html>
