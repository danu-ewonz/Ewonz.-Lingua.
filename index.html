<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700;900&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top left, #1a1a1a, #000000 60%);
    overflow:hidden;
}

/* BACKGROUND GLOW */
body::before,
body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    z-index:0;
}

body::before{
    background:#ffd700;
    top:10%;
    left:15%;
    opacity:0.15;
}

body::after{
    background:#3b82f6;
    bottom:10%;
    right:15%;
    opacity:0.15;
}

/* FRAME */
.phone{
    width:360px;
    height:480px;
    border:2px solid #ffd700;
    border-radius:22px;
    background:#0a0a0a;
    box-shadow:0 0 18px #ffd700;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1;
}

/* BUTTON */
.card{
    border:1px solid #ffd700;
    background:rgba(0,0,0,0.4);
    padding:14px 18px;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-weight:800;
    font-size:14px;
    transition:0.25s;
    text-align:center;
}

.card:hover{
    box-shadow:0 0 12px #ffd700;
    transform:scale(1.03);
}
</style>
</head>

<body>

<div class="phone">
    <div class="card" onclick="goLang()">
        Start Learning Language
    </div>
</div>

<script>
function goLang(){
    // 🔥 SAFE RELATIVE PATH (NO FILE NOT FOUND)
    window.location.href = "./language.html";
}
</script>

</body>
</html>
