<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0a0a0a;
    color:white;
    text-align:center;
}

/* TITLE */
.title{
    margin-top:25px;
    font-size:26px;
    font-weight:bold;
    color:#ffd700;
    text-shadow:0 0 10px #ffd700, 0 0 20px #b8860b;
}

.subtitle{
    color:#aaa;
    margin-bottom:10px;
}

/* COUNTDOWN */
.countdown{
    margin:15px;
    font-size:14px;
    color:#fff;
    border:1px solid #333;
    display:inline-block;
    padding:10px 15px;
    border-radius:10px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
    padding:20px;
    max-width:420px;
    margin:auto;
}

/* CARD */
.card{
    border:1px solid #ffd700;
    background:transparent;
    padding:18px;
    border-radius:12px;
    cursor:pointer;
    position:relative;
    transition:0.3s;
    color:white;
}

/* HOVER */
.card:hover{
    box-shadow:0 0 10px #ffd700;
    transform:scale(1.03);
}

/* LOCK TAG */
.lock{
    position:absolute;
    top:8px;
    right:10px;
    font-size:12px;
    background:red;
    padding:3px 8px;
    border-radius:6px;
    color:white;
}

/* SMALL TEXT */
.small{
    font-size:12px;
    color:#aaa;
}

/* DISABLED LOOK */
.disabled{
    opacity:0.6;
}
</style>
</head>

<body>

<div class="title">🌐 Ewonz Lingua</div>
<div class="subtitle">Select Your Language</div>

<!-- COUNTDOWN -->
<div class="countdown" id="countdown">Loading...</div>

<div class="grid">

    <!-- JAPANESE (OPEN) -->
    <div class="card" onclick="openPage('japanese/index.html')">
        🇯🇵 Japanese Language
        <div class="small">Start learning Japanese</div>
    </div>

    <!-- CHINESE (LOCKED) -->
    <div class="card disabled" onclick="locked()">
        <div class="lock">🔒 LOCK</div>
        🇨🇳 Chinese Language
        <div class="small">Coming soon</div>
    </div>

    <!-- KOREAN (LOCKED) -->
    <div class="card disabled" onclick="locked()">
        <div class="lock">🔒 LOCK</div>
        🇰🇷 Korean Language
        <div class="small">Coming soon</div>
    </div>

    <!-- RUSSIAN (LOCKED) -->
    <div class="card disabled" onclick="locked()">
        <div class="lock">🔒 LOCK</div>
        🇷🇺 Russian Language
        <div class="small">Coming soon</div>
    </div>

</div>

<script>
function openPage(page){
    window.location.href = page;
}

/* LOCK ALERT */
function locked(){
    alert("🚀 Coming Soon - 2026.11.28");
}

/* COUNTDOWN TIMER */
function updateCountdown(){
    let targetDate = new Date("2026-11-28T00:00:00").getTime();
    let now = new Date().getTime();
    let diff = targetDate - now;

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));
    let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
        "⏳ Coming Soon: " + days + "d " + hours + "h " + minutes + "m " + seconds + "s";
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
