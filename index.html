<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">

<style>

/* 🚫 BLOCK COPY EVERYTHING */
*{
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}

/* BODY */
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* ✅ BACKGROUND IMAGE ADDED ONLY */
    background: url("1781096123066_edit_71005599869154.png") center/cover no-repeat fixed;

    overflow:hidden;

    -webkit-touch-callout:none;
}

/* GLOW */
body::before,
body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    z-index:0;
}

body::before{
    background:#ffd700;
    top:10%;
    left:15%;
    opacity:0.15;
}

body::after{
    background:#3b82f6;
    bottom:10%;
    right:15%;
    opacity:0.15;
}

/* FRAME */
.phone{
    width:360px;
    height:480px;
    border:2px solid #ffd700;
    border-radius:22px;
    background:#0a0a0a;
    box-shadow:0 0 10px rgba(255,215,0,0.3);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:1;
}

/* CONTENT */
.content{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
    color:white;
    text-align:center;
}

/* TITLE */
.title{
    font-size:24px;
    font-weight:700;
    letter-spacing:3px;
    margin-top:10px;
}

/* ABOUT */
.about{
    font-size:13px;
    color:#e0e0e0;
    line-height:1.6;
    max-width:320px;
    font-family:'Dancing Script', cursive;
    font-weight:600;
}

/* GAP */
.big-gap{ height:22px; }
.gap{ height:6px; }

/* GOLD */
.gold{
    font-size:10px;
    color:rgba(255,215,0,0.75);
    font-weight:600;
    letter-spacing:1px;
}

/* TEXT */
.text{
    font-size:10px;
    color:#aaa;
    font-weight:500;
    letter-spacing:1px;
}

/* CONTACT */
.contact{
    color:#ff2d2d;
    font-weight:800;
    cursor:pointer;
}

/* BUTTON */
.card{
    border:1px solid #ffd700;
    background:rgba(0,0,0,0.4);
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-weight:600;
    font-size:13px;
    margin-top:auto;
    margin-bottom:10px;
}

</style>
</head>

<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">

<div class="phone">

<div class="content">

    <div class="title">EWONZ LINGUA</div>

    <div class="big-gap"></div>

    <div class="about">
        Discover the world through language with Ewonz Lingua.  
        A modern learning platform designed to help you explore languages in a simple, clear, and structured way.
    </div>

    <div class="big-gap"></div>

    <div class="gold">SPECIAL THANKS</div>
    <div class="gap"></div>
    <div class="text"><strong>JAPANESE - TSUKI SENSEI</strong></div>

    <div class="big-gap"></div>

    <div class="gold">UI DESIGN & DEVELOPMENT</div>
    <div class="gap"></div>
    <div class="text">
        <strong>DANU EWONZ</strong> -
        <span class="contact" onclick="openWhatsApp()">CONTACT</span>
    </div>

    <div style="flex:1"></div>

    <div class="card" onclick="goLang()">
        Start Learning Language
    </div>

</div>

</div>

<script>
function goLang(){
    window.location.href = "./language.html";
}

function openWhatsApp(){
    window.open("https://wa.me/94778730530", "_blank");
}
</script>

</body>
</html>
