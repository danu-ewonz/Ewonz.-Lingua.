<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top left, #1a1a1a, #000000 60%);
    overflow:hidden;
}

/* GLOW */
body::before,
body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    z-index:0;
}

body::before{
    background:#ffd700;
    top:10%;
    left:15%;
    opacity:0.15;
}

body::after{
    background:#3b82f6;
    bottom:10%;
    right:15%;
    opacity:0.15;
}

/* FRAME */
.phone{
    width:360px;
    height:480px;
    border:2px solid #ffd700;
    border-radius:22px;
    background:#0a0a0a;
    box-shadow:0 0 18px #ffd700;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:1;
}

/* CONTENT */
.content{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
    color:white;
    text-align:center;
}

/* TITLE */
.title{
    font-size:24px;
    font-weight:700;
    letter-spacing:3px;
    margin-top:10px;
}

/* ABOUT */
.about{
    font-size:13px;
    color:#e0e0e0;
    line-height:1.6;
    max-width:320px;
    font-family:'Dancing Script', cursive;
    font-weight:600;
}

/* GAP */
.big-gap{
    height:22px;
}

.gap{
    height:6px;
}

/* TEXT COLORS */
.gold{
    font-size:10px;
    color:#ffd700;
    font-weight:600;
    letter-spacing:1px;
}

.text{
    font-size:10px;
    color:#aaa;
    font-weight:500;
    letter-spacing:1px;
}

/* CONTACT */
.contact{
    color:red;
    font-weight:700;
    cursor:pointer;
}

.contact:hover{
    text-shadow:0 0 8px red;
}

/* BUTTON */
.card{
    border:1px solid #ffd700;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(6px);
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    transition:0.25s;
    color:white;
    font-weight:600;
    font-size:13px;
    text-align:center;
    margin-top:auto;
    margin-bottom:10px;
}

.card:hover{
    box-shadow:0 0 12px #ffd700;
    transform:scale(1.02);
}
</style>
</head>

<body>

<div class="phone">

<div class="content">

    <!-- TITLE -->
    <div class="title">EWONZ LINGUA</div>

    <div class="big-gap"></div>

    <!-- ABOUT -->
    <div class="about">
        Discover the world through language with Ewonz Lingua.  
        A modern learning platform designed to help you explore languages in a simple, clear, and structured way.
    </div>

    <div class="big-gap"></div>

    <!-- SPECIAL THANKS -->
    <div class="gold">SPECIAL THANKS</div>
    <div class="gap"></div>
    <div class="text">JAPANESE - TSUKI SENSEI</div>

    <div class="big-gap"></div>

    <!-- UI DESIGN -->
    <div class="gold">UI DESIGN & DEVELOPMENT</div>
    <div class="gap"></div>
    <div class="text">
        DANU EWONZ -
        <span class="contact" onclick="openWhatsApp()">CONTACT</span>
    </div>

    <div style="flex:1"></div>

    <!-- START BUTTON -->
    <div class="card" onclick="goLang()">
        Start Learning Language
    </div>

</div>

</div>

<script>
function goLang(){
    // FIX: correct GitHub Pages safe relative path
    window.location.href = "language.html";
}

function openWhatsApp(){
    window.open("https://wa.me/9477870530", "_blank");
}
</script>

</body>
</html>
