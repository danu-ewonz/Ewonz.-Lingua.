<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ewonz Lingua</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">

<style>

/* 🚫 BLOCK COPY EVERYTHING */
*{
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}

/* BODY */
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top left, #1a1a1a, #000000 60%);
    overflow:hidden;

    -webkit-touch-callout:none;
}

/* GLOW */
body::before,
body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    z-index:0;
}

body::before{
    background:#ffd700;
    top:10%;
    left:15%;
    opacity:0.15;
}

body::after{
    background:#3b82f6;
    bottom:10%;
    right:15%;
    opacity:0.15;
}

/* FRAME */
.phone{
    width:360px;
    height:480px;
    border:2px solid #ffd700;
    border-radius:22px;

    /* ✅ BACKGROUND IMAGE FIX */
    background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
    url("1781096123066_edit_71005599869154.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    box-shadow:0 0 10px rgba(255,215,0,0.3);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:1;
}

/* CONTENT */
.content{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
    color:white;
    text-align:center;
}

/* ANIMATIONS */
@keyframes fadeUp{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes glowText{
    0%{ text-shadow:0 0 5px rgba(255,215,0,0.2); }
    50%{ text-shadow:0 0 12px rgba(255,215,0,0.6); }
    100%{ text-shadow:0 0 5px rgba(255,215,0,0.2); }
}

/* TITLE */
.title{
    font-size:24px;
    font-weight:700;
    letter-spacing:3px;
    margin-top:10px;
    animation:fadeUp 0.8s ease-out, glowText 3s infinite;
}

/* ABOUT */
.about{
    font-size:13px;
    color:#e0e0e0;
    line-height:1.6;
    max-width:320px;
    font-family:'Dancing Script', cursive;
    font-weight:600;
    animation:fadeUp 1s ease-out;
}

/* GAP */
.big-gap{ height:22px; }
.gap{ height:6px; }

/* GOLD */
.gold{
    font-size:10px;
    color:rgba(255,215,0,0.75);
    font-weight:600;
    letter-spacing:1px;
    animation:fadeUp 1.2s ease-out;
}

/* TEXT */
.text{
    font-size:10px;
    color:#aaa;
    font-weight:500;
    letter-spacing:1px;
    animation:fadeUp 1.4s ease-out;
}

.text strong{
    font-weight:600;
}

/* CONTACT */
.contact{
    color:#ff2d2d;
    font-weight:800;
    cursor:pointer;
}

.contact:hover{
    text-shadow:0 0 10px rgba(255,45,45,0.7);
}

/* BUTTON */
.card{
    border:1px solid #ffd700;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(6px);
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    transition:0.25s;
    color:white;
    font-weight:600;
    font-size:13px;
    text-align:center;
    margin-top:auto;
    margin-bottom:10px;
    animation:fadeUp 1.6s ease-out;
}

.card:hover{
    box-shadow:0 0 12px #ffd700;
    transform:scale(1.02);
}
</style>
</head>

<body oncontextmenu="return false" oncopy="return false" oncut="return false" onpaste="return false">

<div class="phone">

<div class="content">

    <div class="title">EWONZ LINGUA</div>

    <div class="big-gap"></div>

    <div class="about">
        Discover the world through language with Ewonz Lingua.  
        A modern learning platform designed to help you explore languages in a simple, clear, and structured way.
    </div>

    <div class="big-gap"></div>

    <div class="gold">SPECIAL THANKS</div>
    <div class="gap"></div>
    <div class="text"><strong>JAPANESE - TSUKI SENSEI</strong></div>

    <div class="big-gap"></div>

    <div class="gold">UI DESIGN & DEVELOPMENT</div>
    <div class="gap"></div>
    <div class="text">
        <strong>DANU EWONZ</strong> -
        <span class="contact" onclick="openWhatsApp()">CONTACT</span>
    </div>

    <div style="flex:1"></div>

    <div class="card" onclick="goLang()">
        Start Learning Language
    </div>

</div>

</div>

<script>
function goLang(){
    window.location.href = "./language.html";
}

function openWhatsApp(){
    window.open("https://wa.me/94778730530", "_blank");
}

document.addEventListener('keydown', function(e){
    if(
        (e.ctrlKey && ['c','a','u','s'].includes(e.key)) ||
        e.key === 'F12'
    ){
        e.preventDefault();
        return false;
    }
});
</script>

</body>
</html>
