<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT - N5 Sample Paper - 1</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Montserrat;
}

.frame{
width:360px;
height:640px;
border:2px solid gold;
border-radius:20px;
background:#0a0a0a;
display:flex;
flex-direction:column;
overflow:hidden;
}

.header{
text-align:center;
padding:10px;
border-bottom:1px solid gold;
}

.title{
color:gold;
font-size:18px;
font-weight:700;
}

.subtitle{
color:white;
font-size:10px;
font-weight:700;
margin-top:3px;
}

.scroll{
flex:1;
overflow-y:auto;
padding:10px;
}

.q{
background:#111;
padding:10px;
margin-bottom:10px;
border-radius:10px;
color:white;
font-size:19px;
font-weight:700;
line-height:1.5;
}

.qnum{color:gold;font-weight:900;margin-right:6px;}
.bracket{color:red;font-weight:900;}

button{
width:100%;
margin-top:5px;
padding:10px;
background:#1c1c1c;
border:1px solid #333;
color:white;
border-radius:6px;
font-size:17px;
font-weight:700;
text-align:center;
}

.correct{background:#1f6f3a;}
.wrong{background:#7a1f1f;}

.bottom{
display:flex;
border-top:1px solid gold;
height:55px;
}

.item{
flex:1;
display:flex;
justify-content:center;
align-items:center;
border-right:1px solid #333;
color:white;
font-size:12px;
font-weight:700;
}

.item:last-child{border:none;}

.back-btn{
width:100%;
height:100%;
background:none;
border:none;
color:red;
font-weight:700;
}

#timer{
color:gold;
font-size:12px;
font-weight:700;
}

/* RESULT SCREEN */
#resultScreen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.resultBox{
width:300px;
padding:20px;
border:2px solid gold;
background:#111;
border-radius:15px;
text-align:center;
color:white;
}

.resultBox h1{color:gold;}
</style>
</head>

<body>

<!-- RESULT -->
<div id="resultScreen">
<div class="resultBox">
<h1>RESULT</h1>
<p id="rScore"></p>
<p id="rCorrect"></p>
<p id="rWrong"></p>
</div>
</div>

<div class="frame">

<div class="header">
<div class="title">JLPT N5 MOCK PAPERS</div>
<div class="subtitle">PAPER MADE BY DANU EWONZ</div>
</div>

<div class="scroll" id="exam"></div>

<div class="bottom">
<div class="item"><button class="back-btn" onclick="history.back()">← BACK</button></div>
<div class="item" id="correct">✔ 0</div>
<div class="item" id="wrong">❌ 0</div>
<div class="item" id="score">⭐ 0/50</div>
<div class="item" id="timer">⏱ 60:00</div>
</div>

</div>

<script>

/* ================= 50 QUESTIONS ================= */
const baseQ = [
["1 学生","がくせい","がっせい","がくしょう","がっしょう",0],
["2 食べる","たべる","ためる","たべりる","だべる",0],
["3 電車","でんしゃ","てんしゃ","でんさ","でんしゃ",0],
["4 本","ほん","ぽん","もん","ぼん",0],
["5 見ます","みます","けんます","けます","けんします",0],
["6 学校","がっこう","がくこう","がっこ","がくこ",0],
["7 日本","にほん","にっぽん","にほ","にっぽ",0],
["8 友だち","ともだち","ゆうだち","ともたち","ゆうたち",0],
["9 行きます","いきます","ゆきます","ぎきます","いきいます",0],
["10 食べます","たべます","のみます","かいます","いきます",0],

["11 えいがを ( )","見ます","聞ます","書き","話ます",0],
["12 みずを ( )","飲みます","見るます","行ます","買ます",0],
["13 いすに ( )","座ります","立ちます","寝ます","起きます",0],
["14 ほんを ( )","読みます","聞きます","見ます","買います",0],
["15 ごはんを ( )","食べます","飲みます","行きます","買います",0],

["16 がっこうへ ( )","行きます","来ます","帰ります","見ます",0],
["17 ともだちは ( )","元気","暑い","寒い","小さい",0],
["18 てんきが ( )","いい","悪い","暑い","寒い",0],
["19 きのう ( )","見ました","行きました","食べました","買いました",0],
["20 あさごはんを ( )","食べます","飲みます","行きます","買います",0],

["21 7時に ( )","起きます","寝ます","行きます","来ます",0],
["22 6時に ( )","帰ります","行きます","見ます","買います",0],
["23 えきは ( )","どこ","ここ","そこ","あそこ",0],
["24 こうえんで ( )","見ました","行きました","食べました","買いました",0],
["25 1000えんです","500","1000","1500","2000",1],

["26 くつは ( )","3000","2000","4000","5000",0],
["27 きょうは ( )","いい","悪い","寒い","暑い",0],
["28 あした ( )","行きます","見ます","食べます","買います",0],
["29 ともだちは ( )","元気","暑い","寒い","小さい",0],
["30 ほんを ( )","読みます","見ます","行きます","買います",0],

["31 ねこが ( )","います","あります","します","です",0],
["32 いぬが ( )","います","あります","します","です",0],
["33 さくらを ( )","見ました","行きました","食べました","買いました",0],
["34 えきは ( )","どこ","ここ","そこ","あそこ",0],
["35 6時に ( )","帰ります","行きます","見ます","買います",0],

["36 がっこうへ ( )","行きます","来ます","帰ります","見ます",0],
["37 ともだちは ( )","元気","あつい","さむい","おおきい",0],
["38 てんきは ( )","いい","悪い","寒い","暑い",0],
["39 さかなは ( )","100","200","300","400",0],
["40 えいがを ( )","見ました","行きました","買いました","食べました",0],

["41 がっこう ( )","は","が","を","に",0],
["42 ほん ( ) よみます","を","に","で","は",0],
["43 みず ( ) のみます","を","に","で","が",0],
["44 えき ( ) いきます","に","へ","で","を",0],
["45 ともだちと ( ) ます","あそび","のみ","かい","いき",0],

["46 あさ ( ) おきます","に","で","が","を",0],
["47 よる ( ) ねます","に","で","が","を",0],
["48 にほん ( ) いきます","へ","に","で","を",0],
["49 がっこう ( ) あります","が","は","に","で",0],
["50 ほんを ( )","読みます","見ます","行きます","買います",0]
];

/* ================= SAFE RANDOM SYSTEM ================= */
const q = baseQ.map(item => {

let question = item[0];
let options = item.slice(1,5);

let correctAnswer = options[item[5]];

// shuffle
let shuffled = [...options];
for(let i=shuffled.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
}

let correctIndex = shuffled.indexOf(correctAnswer);

return [question, ...shuffled, correctIndex];

});

let correct=0;
let wrong=0;
let done={};

/* render */
function render(){
let html="";
q.forEach((x,i)=>{

let qNum=x[0].match(/\d+/)[0];
let qText=x[0].replace(/^\d+\s*/,"");

html+=`
<div class="q">
<span class="qnum">${qNum}.</span>
${qText.replace(/\((.*?)\)/g,'<span class="bracket">($1)</span>')}
`;

for(let j=1;j<=4;j++){
html+=`<button onclick="ans(${i},${j-1},this)">${x[j]}</button>`;
}

html+=`</div>`;
});

document.getElementById("exam").innerHTML=html;
}

/* UI */
function updateUI(){
document.getElementById("correct").innerText="✔ "+correct;
document.getElementById("wrong").innerText="❌ "+wrong;
document.getElementById("score").innerText="⭐ "+correct+"/50";
}

/* answer */
function ans(i,j,el){
if(done[i]) return;
done[i]=true;

let correctIndex=q[i][5];
let btns=el.parentElement.querySelectorAll("button");

btns.forEach((b,idx)=>{
if(idx===correctIndex) b.classList.add("correct");
if(idx===j && j!==correctIndex) b.classList.add("wrong");
b.disabled=true;
});

if(j===correct) correct++;
else wrong++;

updateUI();
checkFinish();
}

/* TIMER */
let time=60*60;
let timerEl=document.getElementById("timer");

let timer=setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;

timerEl.innerText=`⏱ ${m}:${s<10?"0"+s:s}`;

time--;

if(time<0){
finish();
}
},1000);

/* FINISH CHECK */
function checkFinish(){
if(Object.keys(done).length===q.length){
finish();
}
}

/* RESULT */
function finish(){
clearInterval(timer);

document.querySelectorAll("button").forEach(b=>b.disabled=true);

document.getElementById("rScore").innerText="Score: "+correct+"/50";
document.getElementById("rCorrect").innerText="Correct: "+correct;
document.getElementById("rWrong").innerText="Wrong: "+wrong;

document.getElementById("resultScreen").style.display="flex";
}

render();
</script>

</body>
</html>
