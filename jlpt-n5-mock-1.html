<!DOCTYPE html>

<style>
body{

background:#000;
display:flex;
justify-content:center;

}

.frame{
width:360px;
height:640px;
border:2px solid #d4af37;

.header{

}

}

}

.q{

}

.bottom{

.back-btn{

<body>

</div>

<div class="bottom">

<script>

/* ================= 60 SAFE QUESTIONS ================= */

];


/* ================= ENGINE ================= */

let correct=0;
let wrong=0;
let done={};

function load(){

let html="";

for(let i=0;i<q.length;i++){

html+=`<div class="q">
<b>${i+1}. ${q[i][0]}</b>`;

for(let j=1;j<5;j++){
html+=`<button onclick="ans(${i},${j-1},this)">
${q[i][j]}
</button>`;
}

html+=`</div>`;
}

document.getElementById("exam").innerHTML=html;
}

function ans(i,j,el){

if(done[i]) return;
done[i]=true;

let correctIndex=1; // ALWAYS 1st option = correct (SAFE RULE)

let btns=el.parentElement.querySelectorAll("button");

btns.forEach((b,idx)=>{
if(idx===correctIndex) b.classList.add("correct");
if(idx===j && j!==correctIndex) b.classList.add("wrong");
b.disabled=true;
});

if(j===correctIndex) correct++;
else wrong++;

document.getElementById("correct").innerText="✔ "+correct;
document.getElementById("wrong").innerText="❌ "+wrong;
document.getElementById("score").innerText="⭐ "+correct+"/60";
}

load();

</script>
