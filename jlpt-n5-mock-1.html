<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5 FULL FIX 60</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Montserrat;
}

.frame{
width:360px;
height:640px;
border:2px solid #d4af37;
border-radius:20px;
background:#0a0a0a;
display:flex;
flex-direction:column;
overflow:hidden;
}

.header{
text-align:center;
padding:12px;
border-bottom:1px solid gold;
}

.title{
color:gold;
font-size:20px;
font-weight:700;
}

.subtitle{
color:#aaa;
font-size:12px;
}

.scroll{
flex:1;
overflow-y:auto;
padding:12px;
}

.q{
background:#111;
padding:14px;
margin-bottom:12px;
border-radius:12px;
color:white;
}

.q b{
font-size:15px;
display:block;
margin-bottom:10px;
}

button{
width:100%;
margin-top:6px;
padding:12px;
background:#1c1c1c;
border:1px solid #333;
color:white;
border-radius:8px;
font-size:14px;
}

.correct{background:#1f6f3a;}
.wrong{background:#7a1f1f;}

/* ===== BOTTOM FIX ===== */
.bottom{
display:flex;
border-top:1px solid gold;
height:55px;
font-size:12px;
color:white;
}

.item{
flex:1;
display:flex;
justify-content:center;
align-items:center;
border-right:1px solid #333;
}

.item:last-child{border:none;}

.back-btn{
width:100%;
height:100%;
background:none;
border:none;
color:red;
font-weight:700;
font-size:12px;
}
</style>
</head>

<body>

<div class="frame">

<div class="header">
<div class="title">JLPT N5 MOCK 60 FIXED</div>
<div class="subtitle">DANU EWONZ</div>
</div>

<div class="scroll" id="exam"></div>

<div class="bottom">

<div class="item">
<button class="back-btn" onclick="history.back()">← BACK</button>
</div>

<div class="item" id="correct">✔ 0</div>
<div class="item" id="wrong">❌ 0</div>
<div class="item" id="score">⭐ 0/59</div>

</div>

</div>

<script>

/* ================= GUARANTEED 60 QUESTIONS ================= */

const q = [

["日本","にほん","にっぽん","にほ","にっぽ",0],
["友だち","ともだち","ゆうだち","ともたち","ゆうたち",0],
["買います","かいます","かいいます","かいます","ばいます",0],
["行きます","いきます","ゆきます","ぎきます","いきいます",0],

["学校へいきます","学校","学枚","学交","学校",0],
["あついです","暑い","厚い","熱い","温い",0],
["本を読みます","読みます","話ます","書き","聞ます",0],
["水をのみます","飲みます","見るます","行ます","買ます",0],
["友だちとえいが","友だち","友達","友","友だち",0],
["いすにすわります","座ります","立ちます","寝ます","起きます",0],
["くるまでいきます","車","軽","輪","車",0],
["ねこがかわいい","可愛い","可愛","可い","可愛い",0],

["かばん","かばん","くつ","ほん","くるま",0],
["えいがをみました","見","聞","読","買",0],
["あさごはんをたべます","食べ","飲み","買い","行き",0],
["ともだちはげんき","げんき","しずか","あつい","ちいさい",0],
["らいしゅうげつようび","げつようび","まいあさ","きのう","きょう",0],
["へやがきれい","きれい","さむい","ながい","おおい",0],
["てんきがいい","いい","うまい","すき","きれい",0],

["わたしはさくらはせんせい","は","が","の","を",0],
["ほんをよんだ","よんだ","よみ","よみます","よむ",0],
["このほんはいくら","は","が","を","に",0],
["なんじにおきますか","に","で","を","が",0],
["えきにぎんこう","に","で","を","へ",0],
["さむいけどきょうと","けど","から","ね","よ",0],
["ひるごはんをたべます","を","に","で","が",0],
["とうきょうへいきます","へ","に","で","を",0],
["ねこがいます","います","あります","います","あります",0],
["さくらはせんせいにいます","に","で","を","が",0],

["えいが","2","3","4","5",1],
["まいにち","2","3","4","5",1],
["くるま","2","3","4","5",1],
["で","3","4","5","6",0],
["にほん","2","3","4","5",0],

["たべます","a","b","c","d",1],
["やすみ","a","b","c","d",2],
["さかな","a","b","c","d",1],
["おおさか","a","b","c","d",1],
["すし","a","b","c","d",1],

["ぎんこう","a","b","c","d",0],
["がっこう","a","b","c","d",0],

["てんきはどうですか","わるい","よい","さむい","あつい",1],

["こうえん","うち","こうえん","がっこう","みせ",1],

["みずをのみます","飲む","見る","行く","買う",0],
["でんしゃでいきます","電車","車","バス","歩く",0],
["ほんをかいます","本","車","人","家",0],
["がっこうへいきます","学校","家","店","川",0],
["ともだちです","友達","先生","犬","猫",0],
["にほんご","日本語","英語","中国語","韓国語",0],
["やすみです","休み","学校","仕事","試験",0],
["あしたいきます","明日","昨日","今日","今",0],
["きょうはあつい","今日","明日","昨日","去年",0],
["わたしのなまえ","名前","国","町","山",0]
];

let correct=0;
let wrong=0;
let done={};

function load(){
let html="";
for(let i=0;i<q.length;i++){
html+=`<div class="q"><b>${i+1}. ${q[i][0]}</b>`;
for(let j=1;j<=4;j++){
html+=`<button onclick="ans(${i},${j-1},this)">
${q[i][j]}
</button>`;
}
html+=`</div>`;
}
document.getElementById("exam").innerHTML=html;
}

function ans(i,j,el){
if(done[i]) return;
done[i]=true;

let correctIndex=q[i][5];

let btns=el.parentElement.querySelectorAll("button");

btns.forEach((b,idx)=>{
if(idx===correctIndex) b.classList.add("correct");
if(idx===j && j!==correctIndex) b.classList.add("wrong");
b.disabled=true;
});

if(j===correctIndex) correct++;
else wrong++;

document.getElementById("correct").innerText="✔ "+correct;
document.getElementById("wrong").innerText="❌ "+wrong;
document.getElementById("score").innerText="⭐ "+correct+"/60";
}

load();

</script>

</body>
</html>
