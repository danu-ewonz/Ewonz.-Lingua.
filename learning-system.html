<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 5s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#e6e6e6;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:11px;
    border-radius:10px;
    background:#111;
    color:#fff;

    font-family:'Montserrat', sans-serif;
    font-size:12px;
    font-weight:600;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:1px;

    position:relative;
    overflow:hidden;
}

/* BUTTON BORDER ANIMATION */
.btn::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:10px;
    padding:2px;

    background:linear-gradient(90deg,
        transparent,
        #b8860b,
        #ffd700,
        #b8860b,
        transparent
    );

    background-size:200% 100%;
    animation:move 5s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* =========================
LOCKED NAV SYSTEM
========================= */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);
}

/* ITEMS */
.nav-item,
.nav-center{
    flex:1;
    text-align:center;

    font-weight:700;
    letter-spacing:1px;
    white-space:nowrap;
}

/* SIDE BUTTONS */
.nav-item{
    color:#ff3b3b;
    font-size:13px;
    cursor:pointer;
    transition:0.2s ease;
}

/* CENTER */
.nav-center{
    color:#ffd700;
    font-size:12px;
}

/* TOUCH EFFECT */
.nav-item:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATIONS */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

@keyframes move{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<!-- FRAME -->
<div class="frame">

    <div class="title">LEARNING SYSTEM</div>
    <div class="line"></div>

    <div class="grid">

        <div class="btn">Japanese Roadmap</div>
        <div class="btn">Beginner Guide</div>
        <div class="btn">Study Plan</div>
        <div class="btn">Learning Tips</div>
        <div class="btn">Daily Practice</div>

    </div>

</div>

<!-- OUTSIDE NAV -->
<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">
        BACK
    </div>

    <div class="nav-center">
        ← EWONZ LINGUA →
    </div>

    <div class="nav-item" onclick="location.href='index.html'">
        HOME
    </div>

</div>

</body>
</html>
