<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 5s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#e6e6e6;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;   /* 🔥 improved spacing */
    padding:15px;
}

/* BUTTON (BIG VERSION) */
.btn{
    padding:16px;              /* 🔥 bigger */
    border-radius:12px;
    background:#111;
    color:#fff;

    font-family:'Montserrat', sans-serif;
    font-size:15px;            /* 🔥 bigger text */
    font-weight:700;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:1.5px;

    position:relative;
    overflow:hidden;
    cursor:pointer;
}

/* BUTTON BORDER ANIMATION */
.btn::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:12px;
    padding:2px;

    background:linear-gradient(90deg,
        transparent,
        #b8860b,
        #ffd700,
        #b8860b,
        transparent
    );

    background-size:200% 100%;
    animation:move 5s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* 🔒 LOCKED STYLE */
.locked{
    opacity:0.4;
    pointer-events:none;
    cursor:not-allowed;
    position:relative;
}

/* 🔴 RED EWONZ TAG */
.locked::after{
    content:"LOCKED";
    position:absolute;
    top:6px;
    right:10px;

    font-size:9px;
    font-weight:700;
    letter-spacing:1px;

    color:#ff3b3b;
    border:1px solid rgba(255,59,59,0.6);
    padding:2px 5px;
    border-radius:4px;
    background:transparent;
}

/* NAV */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);
}

/* ITEMS */
.nav-item,
.nav-center{
    flex:1;
    text-align:center;
    font-weight:700;
    letter-spacing:1px;
    white-space:nowrap;
}

/* SIDE BUTTONS */
.nav-item{
    color:#ff3b3b;
    font-size:13px;
    cursor:pointer;
}

/* CENTER */
.nav-center{
    color:#ffd700;
    font-size:12px;
}

/* TOUCH EFFECT */
.nav-item:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATIONS */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

@keyframes move{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

    <div class="title">LEARNING SYSTEM</div>
    <div class="line"></div>

    <div class="grid">

        <div class="btn locked">
            Japanese Roadmap
        </div>

        <div class="btn" onclick="location.href='beginner-guide.html'">
            Beginner Guide
        </div>

        <div class="btn" onclick="location.href='study-plan.html'">
            Study Plan
        </div>

        <div class="btn" onclick="location.href='learning-tips.html'">
            Learning Tips
        </div>

        <div class="btn" onclick="location.href='daily-practice.html'">
            Daily Practice
        </div>

    </div>

</div>

<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">
        BACK
    </div>

    <div class="nav-center">
        ← EWONZ LINGUA →
    </div>

    <div class="nav-item" onclick="location.href='index.html'">
        HOME
    </div>

</div>

</body>
</html>
