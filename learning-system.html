<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

/* BODY */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:url("1781102623679_edit_59706522898481.png") center center no-repeat;
    background-size:cover;

    font-family:'Poppins',sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;

    border-radius:20px;
    overflow:hidden;

    display:flex;
    flex-direction:column;

    position:relative;
    background:rgba(0,0,0,0.55);
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* CONTENT */
.title,.line,.grid,.bottom-nav{
    position:relative;
    z-index:2;
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:16px;
    border-radius:12px;

    background:rgba(0,0,0,0.55);
    border:1.5px solid rgba(184,134,11,0.9);

    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-size:15px;
    font-weight:700;

    text-align:center;
    text-transform:uppercase;

    cursor:pointer;
    position:relative;
}

/* ACTIVE */
.btn:active{
    transform:scale(0.97);
    background:#b8860b;
    color:#000;
}

/* 🔒 LOCK STYLE */
.locked{
    opacity:0.4;
}

/* LOCK TAG */
.locked::after{
    content:"LOCK";
    position:absolute;
    top:6px;
    right:8px;

    font-size:9px;
    font-weight:700;
    color:#ff3b3b;

    border:1px solid rgba(255,59,59,0.6);
    padding:2px 6px;
    border-radius:4px;
}

/* NAV */
.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.2);
}

.nav-item{
    flex:1;
    text-align:center;
    font-weight:700;
    font-size:13px;
    color:#ff3b3b;
    cursor:pointer;
}

.nav-center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:12px;
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.85);
    z-index:9999;
}

.popup-box{
    width:300px;
    background:#111;
    border:2px solid #ffd700;
    border-radius:12px;
    padding:18px;
    text-align:center;
    color:#fff;
}

.close-btn{
    margin-top:10px;
    padding:8px 14px;
    background:#b8860b;
    border:none;
    font-weight:700;
    cursor:pointer;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">LEARNING SYSTEM</div>
<div class="line"></div>

<div class="grid">

    <!-- LOCKED BUTTON (NOW CLICKABLE FOR POPUP) -->
    <div class="btn locked" onclick="openLock('Japanese Roadmap')">
        Japanese Roadmap
    </div>

    <div class="btn" onclick="location.href='beginner-guide.html'">
        Beginner Guide
    </div>

    <div class="btn" onclick="location.href='study-plan.html'">
        Study Plan
    </div>

    <div class="btn" onclick="location.href='learning-tips.html'">
        Learning Tips
    </div>

    <div class="btn" onclick="location.href='daily-practice.html'">
        Daily Practice
    </div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">BACK</div>

    <div class="nav-center">← EWONZ LINGUA →</div>

    <div class="nav-item" onclick="location.href='index.html'">HOME</div>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

<div class="popup-box">

    <h3 style="color:red;">LOCKED</h3>
    <p id="langText">Coming Soon</p>
    <p style="color:#ffd700;">2026 / 11 / 28</p>
    <p id="countdown">Loading...</p>

    <button class="close-btn" onclick="closePopup()">CLOSE</button>

</div>

</div>

<script>

let timer;
const target = new Date("2026-11-28T00:00:00").getTime();

function openLock(name){
    document.getElementById("popup").style.display = "flex";
    document.getElementById("langText").innerText = name + " Coming Soon";

    updateCountdown();
    clearInterval(timer);
    timer = setInterval(updateCountdown,1000);
}

function updateCountdown(){

    let now = new Date().getTime();
    let diff = target - now;

    if(diff <= 0){
        document.getElementById("countdown").innerText = "NOW AVAILABLE 🎉";
        clearInterval(timer);
        return;
    }

    let d = Math.floor(diff/(1000*60*60*24));
    let h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    let m = Math.floor((diff%(1000*60*60))/(1000*60));
    let s = Math.floor((diff%(1000*60))/1000);

    document.getElementById("countdown").innerText =
        `${d}d ${h}h ${m}m ${s}s`;
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
    clearInterval(timer);
}

</script>

</body>
</html>
