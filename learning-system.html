<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* 🚫 COPY BLOCK */
*{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 5s linear infinite; /* 🔥 SLOW SPEED */

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#e6e6e6;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
    flex:1;
}

/* 🔥 BUTTON FULL BORDER */
.btn{
    padding:11px;
    border-radius:10px;
    background:#111;
    color:#fff;

    font-family:'Montserrat', sans-serif;
    font-size:12px;
    font-weight:600;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:1px;

    position:relative;
    overflow:hidden;
}

/* 🌟 SLOW GOLD BORDER ANIMATION */
.btn::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:10px;
    padding:2px;

    background:linear-gradient(90deg,
        transparent,
        #b8860b,
        #ffd700,
        #b8860b,
        transparent
    );

    background-size:200% 100%;
    animation:move 5s linear infinite; /* 🔥 SLOW SPEED */

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* NAV */
.bottom-nav{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    padding:10px 0;
    font-size:13px;

    position:relative;
    border-top:1px solid rgba(255,215,0,0.15);
}

/* NAV LINE */
.bottom-nav::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:2px;

    background:linear-gradient(90deg,
        transparent,
        #b8860b,
        #ffd700,
        #b8860b,
        transparent
    );

    background-size:200% 100%;
    animation:move 5s linear infinite; /* 🔥 SLOW SPEED */
}

/* NAV TEXT */
.nav-text{
    color:red;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

/* CENTER */
.center{
    color:#b8860b;
    font-weight:700;
    white-space:nowrap;
}

/* ANIMATIONS */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

@keyframes move{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">LEARNING SYSTEM</div>

<div class="line"></div>

<div class="grid">

    <div class="btn">Japanese Roadmap</div>
    <div class="btn">Beginner Guide</div>
    <div class="btn">Study Plan</div>
    <div class="btn">Learning Tips</div>
    <div class="btn">Daily Practice</div>

</div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-text">← BACK →</div>

    <div class="center">EWONZ LINGUA</div>

    <div class="nav-text">→ HOME →</div>

</div>

</body>
</html>
