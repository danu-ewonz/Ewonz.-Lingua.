<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JLPT FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    height:100%;
    overflow:hidden;
}

/* BODY */
body{
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Poppins;
    gap:10px;
}

/* FRAME (9:16) */
.frame{
    width:360px;
    height:640px;

    background:url("1781342857052_edit_121079689335139.png") center/cover no-repeat;

    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
}

/* BORDER ANIMATION */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;

    pointer-events:none;
}

/* HEADER */
.header{
    text-align:center;
    padding-top:14px;
    color:#fff;
    font-size:18px;
    font-weight:700;
    position:relative;
    z-index:1;
}

.sub{
    text-align:center;
    color:#b8860b;
    font-size:12px;
    margin-top:4px;
    font-weight:600;
    position:relative;
    z-index:1;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
    position:relative;
    z-index:1;
}

/* GRID */
.grid{
    position:absolute;
    top:80px;
    bottom:70px;
    left:0;
    right:0;

    overflow-y:auto;
    -webkit-overflow-scrolling:touch;

    padding:10px;
    z-index:1;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    margin-bottom:10px;
    border-radius:10px;
    background:#111;
    border:2px solid #b8860b;
    color:#fff;

    text-align:center;
    font-size:16px;
    font-weight:700;
}

.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

/* NAV INSIDE FRAME */
.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 14px;

    background:#0a0a0a;
    border:1px solid rgba(255,215,0,0.2);

    border-radius:12px;

    position:absolute;
    bottom:0;
    left:0;
    z-index:2;
}

/* NAV ITEMS */
.nav-btn{
    width:70px;
    text-align:center;
    color:#ff3b3b;
    font-weight:700;
    font-size:13px;
}

.nav-center{
    flex:1;
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:13px;
}

.nav-btn:active{
    transform:scale(0.95);
}

/* BORDER ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="header">JLPT EXAM</div>
<div class="sub">SELECT YOUR LEVEL</div>
<div class="line"></div>

<div class="grid">

    <div class="btn" onclick="location.href='n5.html'">JLPT - N5</div>
    <div class="btn" onclick="location.href='n4.html'">JLPT - N4</div>
    <div class="btn" onclick="location.href='n3.html'">JLPT - N3</div>
    <div class="btn" onclick="location.href='n2.html'">JLPT - N2</div>
    <div class="btn" onclick="location.href='n1.html'">JLPT - N1</div>

</div>

<!-- NAV INSIDE FRAME -->
<div class="bottom-nav">

<div class="nav-btn" onclick="history.back()">BACK</div>

<div class="nav-center">← EWONZ LINGUA →</div>

<div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</div>

</body>
    </html>
