<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Exam Features</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#0b0b0b;
    font-family:Poppins;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* WRAPPER */
.wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* FRAME (9:16 + BACKGROUND FIX) */
.frame{
    width:360px;
    height:640px;

    background:url("1781343142194_edit_121351580133078.png") center/cover no-repeat;

    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:0;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;
    z-index:1;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100%;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
    text-transform:uppercase;
}

.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
    text-transform:uppercase;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:10px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    background:#111;
    border:2px solid #b8860b;
    color:#fff;
    font-weight:700;
    font-size:16px;
    text-align:center;
    border-radius:10px;
}

.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

/* =========================
GLASS NAV (INSIDE FRAME FIX)
========================= */
.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    position:absolute;
    bottom:0;
    left:0;
    z-index:3;

    background:rgba(10,10,10,0.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-top:1px solid rgba(255,215,0,0.18);
    box-shadow:0 -5px 25px rgba(0,0,0,0.4);
}

/* NAV ITEMS */
.nav-btn,
.center{
    flex:1;
    text-align:center;
    font-weight:700;
    white-space:nowrap;
}

/* SIDE BUTTONS */
.nav-btn{
    color:red;
    font-size:13px;
    cursor:pointer;
}

/* CENTER */
.center{
    color:#ffd700;
    font-size:12px;
}

/* TOUCH */
.nav-btn:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="wrapper">

<div class="frame">

<div class="content">

    <div class="title">EXAM FEATURES</div>
    <div class="subtitle">HOW THE SYSTEM WORKS</div>

    <div class="line"></div>

    <div class="grid">

        <div class="btn">OVERVIEW</div>
        <div class="btn">HOW EXAMS WORK</div>
        <div class="btn">MOCK EXAM MODE</div>
        <div class="btn">TIMER SYSTEM</div>
        <div class="btn">SCORE & RESULT SYSTEM</div>
        <div class="btn">PASS / FAIL RULES</div>
        <div class="btn">LEVEL UNLOCK SYSTEM</div>
        <div class="btn">LEARNING SUPPORT</div>
        <div class="btn">FUTURE UPDATES</div>

    </div>

</div>

<!-- NAV INSIDE FRAME -->
<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">BACK</div>

    <div class="center">← EWONZ LINGUA →</div>

    <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</div>

</div>

</body>
</html>
