<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Special</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#0b0b0b;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Poppins', sans-serif;
}

/* FRAME 9:16 */
.frame{
    width:360px;
    aspect-ratio:9 / 16;

    background:#0a0a0a;
    border-radius:20px;

    display:flex;
    flex-direction:column;

    overflow:hidden;
    position:relative;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:14px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* CONTENT */
.grid{
    flex:1;
    padding:12px;
    overflow-y:auto;

    display:flex;
    flex-direction:column;
    gap:12px;
}

/* BUTTON (LARGER NOW) */
.btn{
    padding:20px 14px;   /* 🔥 increased */
    background:#111;
    color:#fff;

    border-radius:12px;

    font-family:'Montserrat', sans-serif;
    font-size:16px;      /* 🔥 bigger text */
    font-weight:700;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.6px;

    border:1px solid #b8860b;

    cursor:pointer;
    transition:0.2s;
}

/* CLICK */
.btn:active{
    background:#b8860b;
    color:#000;
    transform:scale(0.96);
}

/* NAV */
.bottom-nav{
    height:50px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.2);
}

/* NAV */
.nav-btn{
    flex:1;
    text-align:center;
    font-weight:700;
    font-size:12px;
    color:red;
}

.nav-center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
}

/* TOUCH */
.nav-btn:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">KATAKANA SPECIAL</div>
<div class="line"></div>

<div class="grid">

    <div class="btn" onclick="location.href='katakana-dakuten.html'">Dakuten</div>
    <div class="btn" onclick="location.href='katakana-handakuten.html'">Handakuten</div>
    <div class="btn" onclick="location.href='katakana-yoon.html'">Yōon</div>
    <div class="btn" onclick="location.href='katakana-sokuon.html'">Sokuon</div>
    <div class="btn" onclick="location.href='katakana-choonpu.html'">Chōonpu</div>

</div>

<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">BACK</div>
    <div class="nav-center">← EWONZ LINGUA →</div>
    <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</div>

</body>
</html>
