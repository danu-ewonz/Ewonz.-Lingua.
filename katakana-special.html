<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Special</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#0b0b0b;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-family:'Poppins', sans-serif;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;

    background:#0a0a0a;
    border-radius:20px;

    display:flex;
    flex-direction:column;

    overflow:hidden;
    position:relative;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:15px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* CONTENT */
.grid{
    flex:1;
    padding:15px;
    overflow-y:auto;

    display:flex;
    flex-direction:column;
    gap:10px;
}

/* BUTTON */
.btn{
    padding:12px;
    background:#111;
    color:#fff;
    border-radius:10px;

    font-family:'Montserrat', sans-serif;
    font-size:12px;
    font-weight:600;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:1px;

    border:2px solid #b8860b;
}

/* CLICK */
.btn:active{
    background:#b8860b;
    color:#000;
}

/* NAV */
.bottom-nav{
    width:360px;
    height:55px;

    display:grid;
    grid-template-columns:1fr auto 1fr;

    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);
}

/* LEFT */
.nav-left{
    text-align:center;
    color:red;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}

/* CENTER */
.nav-center{
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:12px;
    white-space:nowrap;
}

/* RIGHT */
.nav-right{
    text-align:center;
    color:red;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}

/* TOUCH */
.nav-left:active,
.nav-right:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<!-- FRAME -->
<div class="frame">

<div class="title">KATAKANA SPECIAL</div>
<div class="line"></div>

<div class="grid">

    <div class="btn" onclick="location.href='katakana-dakuten.html'">Dakuten</div>

    <div class="btn" onclick="location.href='katakana-handakuten.html'">Handakuten</div>

    <div class="btn" onclick="location.href='katakana-yoon.html'">Yōon</div>

    <div class="btn" onclick="location.href='katakana-sokuon.html'">Sokuon</div>

    <div class="btn" onclick="location.href='katakana-choonpu.html'">Chōonpu</div>

</div>

</div>

<!-- OUTSIDE NAV -->
<div class="bottom-nav">

<div class="nav-left" onclick="history.back()">BACK</div>

<div class="nav-center">← EWONZ LINGUA →</div>

<div class="nav-right" onclick="location.href='index.html'">HOME</div>

</div>

</body>
</html>
