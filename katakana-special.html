<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Special</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

/* BODY */
body{
    background:#0b0b0b;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Poppins', sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;

    border-radius:20px;
    position:relative;

    display:flex;
    flex-direction:column;
    overflow:hidden;

    background:url("1781342640624_edit_120955032922208.png") center/cover no-repeat;

    border:2px solid rgba(255,215,0,0.25);
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    pointer-events:none;

    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;

    z-index:2;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:14px;
    z-index:1;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
    z-index:1;
}

/* CONTENT */
.grid{
    flex:1;
    padding:12px;

    display:flex;
    flex-direction:column;
    gap:12px;

    overflow-y:auto;
    z-index:1;
}

/* BUTTON */
.btn{
    padding:20px 14px;

    border-radius:12px;

    color:#fff;
    font-size:16px;
    font-weight:700;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.6px;

    border:2px solid #b8860b;

    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    cursor:pointer;
    transition:0.2s;

    position:relative;
    overflow:hidden;
}

/* CLICK */
.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.96);
}

/* NAV */
.bottom-nav{
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:rgba(0,0,0,0.9);
    border-top:1px solid rgba(255,215,0,0.2);

    z-index:5;
}

/* NAV BUTTONS */
.nav-btn{
    flex:1;
    text-align:center;
    font-weight:700;
    font-size:12px;
    color:red;
}

/* CENTER */
.nav-center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
}

/* TOUCH EFFECT */
.nav-btn:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* SHINE ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:300%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">KATAKANA SPECIAL</div>
<div class="line"></div>

<div class="grid">

    <div class="btn" onclick="location.href='katakana-dakuten.html'">Dakuten</div>
    <div class="btn" onclick="location.href='katakana-handakuten.html'">Handakuten</div>
    <div class="btn" onclick="location.href='katakana-yoon.html'">Yōon</div>
    <div class="btn" onclick="location.href='katakana-sokuon.html'">Sokuon</div>
    <div class="btn" onclick="location.href='katakana-choonpu.html'">Chōonpu</div>

</div>

<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">BACK</div>
    <div class="nav-center">← EWONZ LINGUA →</div>
    <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</div>

</body>
</html>
