<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ewonz Katakana</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    height:100%;
    overflow:hidden;
}

/* BODY */
body{
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Poppins;
    gap:10px;
}

/* FRAME WRAPPER */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    padding-top:12px;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:6px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* SCROLL AREA */
.scroll{
    position:absolute;
    top:70px;
    bottom:0;
    left:0;
    right:0;

    overflow-y:auto;
    -webkit-overflow-scrolling:touch;

    padding:10px;
}

/* GROUP */
.group{
    text-align:center;
    color:#ffd700;
    font-size:11px;
    font-weight:700;
    margin:10px 0;
}

/* ROW */
.row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:8px;
    border-bottom:1px solid rgba(255,215,0,0.12);
}

/* BOX */
.box{
    background:#111;
    border:1px solid #b8860b;
    border-radius:8px;
    padding:8px 10px;
    min-width:60px;
    text-align:center;
    color:#fff;
}

/* ROMAJI */
.romaji{
    font-size:10px;
    color:#aaa;
}

/* ARROW */
.arrow{
    color:#ffd700;
    font-weight:800;
}

/* ================= NAV (FINAL LOCKED) ================= */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 14px;

    background:#0a0a0a;
    border:1px solid rgba(255,215,0,0.2);
    border-radius:12px;
}

/* LEFT + RIGHT */
.nav-btn{
    width:70px;
    text-align:center;
    color:#ff3b3b;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}

/* CENTER */
.nav-center{
    flex:1;
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
}

/* TOUCH */
.nav-btn:active{
    transform:scale(0.95);
    color:#ffd700;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<!-- FRAME -->
<div class="frame">

<div class="title">KATAKANA SYSTEM</div>
<div class="line"></div>

<!-- SCROLL CONTENT -->
<div class="scroll">

<div class="group">G GROUP</div>
<div class="row"><div class="box">カ<div class="romaji">ka</div></div><div class="arrow">→</div><div class="box">ガ<div class="romaji">ga</div></div></div>

<div class="row"><div class="box">キ<div class="romaji">ki</div></div><div class="arrow">→</div><div class="box">ギ<div class="romaji">gi</div></div></div>

<div class="group">Z GROUP</div>
<div class="row"><div class="box">サ<div class="romaji">sa</div></div><div class="arrow">→</div><div class="box">ザ<div class="romaji">za</div></div></div>

<div class="row"><div class="box">シ<div class="romaji">shi</div></div><div class="arrow">→</div><div class="box">ジ<div class="romaji">ji</div></div></div>

<div class="group">D GROUP</div>
<div class="row"><div class="box">タ<div class="romaji">ta</div></div><div class="arrow">→</div><div class="box">ダ<div class="romaji">da</div></div></div>

<div class="row"><div class="box">チ<div class="romaji">chi</div></div><div class="arrow">→</div><div class="box">ヂ<div class="romaji">ji</div></div></div>

<div class="group">B GROUP</div>
<div class="row"><div class="box">ハ<div class="romaji">ha</div></div><div class="arrow">→</div><div class="box">バ<div class="romaji">ba</div></div></div>

<div class="row"><div class="box">ヒ<div class="romaji">hi</div></div><div class="arrow">→</div><div class="box">ビ<div class="romaji">bi</div></div></div>

<div class="row"><div class="box">フ<div class="romaji">fu</div></div><div class="arrow">→</div><div class="box">ブ<div class="romaji">bu</div></div></div>

<div class="row"><div class="box">ヘ<div class="romaji">he</div></div><div class="arrow">→</div><div class="box">ベ<div class="romaji">be</div></div></div>

<div class="row"><div class="box">ホ<div class="romaji">ho</div></div><div class="arrow">→</div><div class="box">ボ<div class="romaji">bo</div></div></div>

</div>

</div>

<!-- NAV (OUTSIDE FRAME) -->
<div class="bottom-nav">

<div class="nav-btn" onclick="history.back()">BACK</div>

<div class="nav-center">← EWONZ LINGUA →</div>

<div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</body>
</html>
