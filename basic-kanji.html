<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kanji Full System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
}

body{
font-family:'Poppins', sans-serif;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* FRAME */
.frame{
width:360px;
height:640px;
background:#0a0a0a;
border-radius:20px;
display:flex;
flex-direction:column;
overflow:hidden;
position:relative;
}

/* BORDER */
.frame::before{
content:"";
position:absolute;
inset:0;
padding:2px;
border-radius:20px;
background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
background-size:300% 100%;
animation:shine 3s linear infinite;

-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
pointer-events:none;
}

/* TITLE */
.title{
text-align:center;
color:#fff;
font-size:18px;
font-weight:700;
margin-top:10px;
}

/* LINE */
.line{
width:80%;
height:2px;
margin:6px auto;
background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.content{
flex:1;
overflow-y:auto;
padding:10px;

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

/* CARD */
.card{
background:#111;
border:1px solid rgba(184,134,11,0.4);
border-radius:12px;
padding:12px;
text-align:center;
}

/* KANJI */
.kanji{
font-size:24px;
font-weight:700;
color:#fff;
}

/* ROMAJI */
.romaji{
font-size:11px;
color:#ffd700;
margin-top:4px;
}

/* MEANING */
.meaning{
font-size:11px;
color:#b8860b;
margin-top:2px;
}

/* NAV */
.bottom-nav{
height:55px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background:#0a0a0a;
border-top:1px solid rgba(255,215,0,0.2);
}

.nav-btn{
flex:1;
text-align:center;
color:#ff3b3b;
font-weight:700;
font-size:12px;
}

.nav-center{
flex:2;
text-align:center;
color:#ffd700;
font-weight:700;
font-size:12px;
}

@keyframes shine{
0%{background-position:0%;}
100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">JLPT / JFT KANJI FULL</div>
<div class="line"></div>

<div class="content" id="list"></div>

<div class="bottom-nav">
<div class="nav-btn" onclick="history.back()">BACK</div>
<div class="nav-center">← EWONZ LINGUA →</div>
<div class="nav-btn" onclick="location.href='index.html'">HOME</div>
</div>
