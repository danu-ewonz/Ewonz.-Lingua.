<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Choon FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    height:100%;
    overflow:hidden;
}

/* BODY */
body{
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Poppins;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    padding-top:14px;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:6px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* SCROLL AREA */
.grid{
    position:absolute;
    top:70px;
    bottom:0;
    left:0;
    right:0;

    overflow-y:auto;
    -webkit-overflow-scrolling:touch;

    padding:10px;
}

/* CARD */
.card{
    background:#111;
    border:1px solid #b8860b;
    border-radius:10px;
    padding:12px;
    text-align:center;
    margin-bottom:10px;
}

/* KANA */
.kana{
    color:#fff;
    font-size:18px;
    font-weight:700;
}

/* ARROW */
.arrow{
    color:#ffd700;
    font-size:14px;
    margin:5px 0;
}

/* ROMAJI */
.romaji{
    color:#aaa;
    font-size:11px;
}

/* NAV */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 14px;

    background:#0a0a0a;
    border:1px solid rgba(255,215,0,0.2);
    border-radius:12px;
}

/* NAV BUTTONS */
.nav-btn{
    width:70px;
    text-align:center;
    color:#ff3b3b;
    font-weight:700;
    font-size:13px;
}

/* CENTER */
.nav-center{
    flex:1;
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:13px;
}

/* TOUCH */
.nav-btn:active{
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">CHŌON (LONG VOWELS)</div>
<div class="line"></div>

<div class="grid">

<div class="card">
    <div class="kana">アー</div>
    <div class="arrow">→</div>
    <div class="romaji">ā (long a)</div>
</div>

<div class="card">
    <div class="kana">イー</div>
    <div class="arrow">→</div>
    <div class="romaji">ī (long i)</div>
</div>

<div class="card">
    <div class="kana">ウー</div>
    <div class="arrow">→</div>
    <div class="romaji">ū (long u)</div>
</div>

<div class="card">
    <div class="kana">エー</div>
    <div class="arrow">→</div>
    <div class="romaji">ē (long e)</div>
</div>

<div class="card">
    <div class="kana">オー</div>
    <div class="arrow">→</div>
    <div class="romaji">ō (long o)</div>
</div>

</div>

</div>

<!-- NAV (OUTSIDE FRAME FIXED) -->
<div class="bottom-nav">

<div class="nav-btn" onclick="history.back()">BACK</div>

<div class="nav-center">← EWONZ LINGUA →</div>

<div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</body>
</html>
