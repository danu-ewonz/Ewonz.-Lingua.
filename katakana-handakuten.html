<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Handakuten</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

/* BODY FIX (IMPORTANT) */
body{
    margin:0;
    background:#0b0b0b;

    height:100vh;
    width:100vw;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    font-family:'Poppins', sans-serif;
    overflow:hidden;
}

/* FRAME WRAPPER (keeps nav outside clean) */
.wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
}

/* 3:4 FRAME (LOCKED SIZE) */
.frame{
    width:360px;
    height:480px;

    background:#0a0a0a;
    border-radius:20px;

    display:flex;
    flex-direction:column;

    overflow:hidden;
    position:relative;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:15px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

/* ROW */
.row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:12px;
    border-bottom:1px solid rgba(255,215,0,0.15);
}

.box{
    padding:10px 14px;
    background:#111;
    border:1px solid #b8860b;
    border-radius:8px;
    min-width:60px;
    text-align:center;
    color:#fff;
    font-size:16px;
    font-weight:600;
}

.arrow{
    color:#ffd700;
    font-size:18px;
}

/* ================= NAV FIX ================= */
.bottom-nav{
    width:360px;

    height:50px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);
}

/* TEXT */
.nav-left,
.nav-right{
    color:red;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}

.nav-center{
    color:#ffd700;
    font-weight:700;
    font-size:12px;
    white-space:nowrap;
}

/* ACTIVE */
.nav-left:active,
.nav-right:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="wrapper">

<!-- FRAME -->
<div class="frame">

    <div class="title">KATAKANA HANDAKUTEN</div>
    <div class="line"></div>

    <div class="grid">

        <div class="row">
            <div class="box">ハ</div>
            <div class="arrow">→</div>
            <div class="box">パ</div>
        </div>

        <div class="row">
            <div class="box">ヒ</div>
            <div class="arrow">→</div>
            <div class="box">ピ</div>
        </div>

        <div class="row">
            <div class="box">フ</div>
            <div class="arrow">→</div>
            <div class="box">プ</div>
        </div>

        <div class="row">
            <div class="box">ヘ</div>
            <div class="arrow">→</div>
            <div class="box">ペ</div>
        </div>

        <div class="row">
            <div class="box">ホ</div>
            <div class="arrow">→</div>
            <div class="box">ポ</div>
        </div>

    </div>

</div>

<!-- NAV (OUTSIDE FRAME - FIXED POSITION) -->
<div class="bottom-nav">

    <div class="nav-left" onclick="history.back()">← BACK →</div>

    <div class="nav-center">EWONZ LINGUA</div>

    <div class="nav-right" onclick="location.href='index.html'">→ HOME →</div>

</div>

</div>

</body>
</html>
