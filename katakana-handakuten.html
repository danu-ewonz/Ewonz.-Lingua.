<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Handakuten</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* BLOCK */
*{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Poppins', sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#ffffff;
    font-size:18px;
    font-weight:700;
    margin-top:15px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

/* ROW */
.row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:12px;
    border-bottom:1px solid rgba(255,215,0,0.15);
}

/* BOX */
.box{
    padding:10px 14px;
    background:#111;
    border:1px solid #b8860b;
    border-radius:8px;
    min-width:60px;
    text-align:center;

    color:#ffffff;   /* 🔥 FIXED WHITE TEXT */
    font-size:16px;
    font-weight:600;
}

/* ARROW */
.arrow{
    color:#ffd700;
    font-weight:700;
    font-size:18px;
}

/* ROMAJI */
.romaji{
    color:#ffffff;   /* 🔥 FIXED WHITE ROMAJI */
    font-size:11px;
    margin-top:3px;
    opacity:0.85;
}

/* NAV */
.bottom-nav{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    padding:10px 0;
    border-top:1px solid rgba(255,215,0,0.15);
}

.nav-text{
    color:red;
    font-weight:700;
    cursor:pointer;
}

.center{
    color:#b8860b;
    font-weight:700;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">KATAKANA HANDAKUTEN</div>
<div class="line"></div>

<div class="grid">

    <div class="row">
        <div class="box">ハ<div class="romaji">ha</div></div>
        <div class="arrow">→</div>
        <div class="box">パ<div class="romaji">pa</div></div>
    </div>

    <div class="row">
        <div class="box">ヒ<div class="romaji">hi</div></div>
        <div class="arrow">→</div>
        <div class="box">ピ<div class="romaji">pi</div></div>
    </div>

    <div class="row">
        <div class="box">フ<div class="romaji">fu</div></div>
        <div class="arrow">→</div>
        <div class="box">プ<div class="romaji">pu</div></div>
    </div>

    <div class="row">
        <div class="box">ヘ<div class="romaji">he</div></div>
        <div class="arrow">→</div>
        <div class="box">ペ<div class="romaji">pe</div></div>
    </div>

    <div class="row">
        <div class="box">ホ<div class="romaji">ho</div></div>
        <div class="arrow">→</div>
        <div class="box">ポ<div class="romaji">po</div></div>
    </div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-text" onclick="history.back()">← BACK →</div>

    <div class="center">EWONZ LINGUA</div>

    <div class="nav-text" onclick="location.href='index.html'">→ HOME →</div>

</div>

</div>

</body>
</html>
