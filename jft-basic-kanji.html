<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JFT-Basic Kanji - Ewonz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
}

html,body{
height:100%;
overflow:hidden;
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Poppins;
}

/* FRAME */
.frame{
width:360px;
height:480px;
background:#0a0a0a;
border-radius:20px;
position:relative;
overflow:hidden;
}

/* BORDER */
.frame::before{
content:"";
position:absolute;
inset:0;
padding:2px;
border-radius:20px;
background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
background-size:300% 100%;
animation:shine 3s linear infinite;

-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);

-webkit-mask-composite:xor;
}

/* TITLE */
.title{
text-align:center;
font-size:16px;
font-weight:700;
color:#fff;
margin-top:14px;
}

.line{
width:80%;
height:2px;
margin:8px auto;
background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* SCROLL */
.content{
position:absolute;
top:60px;
bottom:0;
left:0;
right:0;
overflow-y:auto;
padding:10px;
}

/* CARD */
.card{
background:#111;
border:1px solid rgba(184,134,11,0.35);
border-radius:10px;
padding:10px;
margin-bottom:8px;
text-align:center;
}

.kanji{
font-size:18px;
font-weight:700;
color:#fff;
}

.romaji{
font-size:11px;
color:#ffd700;
margin-top:2px;
}

.meaning{
font-size:11px;
color:#b8860b;
margin-top:2px;
}

/* NAV */
.bottom-nav{
width:360px;
height:55px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background:#0a0a0a;
border-top:1px solid rgba(255,215,0,0.25);
border-radius:12px;
}

.nav-btn{
width:70px;
text-align:center;
color:#ff3b3b;
font-weight:700;
font-size:12px;
cursor:pointer;
}

.center{
flex:1;
text-align:center;
color:#ffd700;
font-weight:700;
font-size:12px;
}

/* ANIMATION */
@keyframes shine{
0%{background-position:0%;}
100%{background-position:100%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">JFT-BASIC KANJI</div>
<div class="line"></div>

<div class="content">
<div id="list"></div>
</div>

</div>

<!-- NAV -->
<div class="bottom-nav">
<div class="nav-btn" onclick="history.back()">BACK</div>
<div class="center">← EWONZ LINGUA →</div>
<div class="nav-btn" onclick="location.href='index.html'">HOME</div>
</div>
