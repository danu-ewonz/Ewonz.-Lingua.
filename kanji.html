<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kanji System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Poppins', sans-serif;
    background:url("1781102623679_edit_59706522898481.png") no-repeat center center;
    background-size:cover;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* FRAME (LOCKED 9:16) */
.frame{
    width:360px;
    aspect-ratio:9/16;
    border-radius:20px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:rgba(10,10,10,0.4);
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:0;
}

/* GOLD BORDER ANIMATION */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
    z-index:2;
}

/* CONTENT LAYER */
.title, .line, .grid, .bottom-nav{
    position:relative;
    z-index:3;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:20px;
    font-weight:700;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:18px;
    flex:1;
    overflow-y:auto;
}

/* BUTTON */
.btn{
    padding:14px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    border-radius:10px;

    font-family:'Montserrat', sans-serif;
    font-size:14px;
    font-weight:700;

    text-align:center;
    border:2px solid #b8860b;
    cursor:pointer;
}

/* ACTIVE EFFECT */
.btn:active{
    transform:scale(0.98);
    background:#b8860b;
    color:#000;
}

/* NAV (LOCKED STANDARD) */
.bottom-nav{
    width:100%;
    height:55px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.15);
}

/* NAV BUTTONS */
.nav-btn{
    flex:1;
    text-align:center;
    font-weight:700;
    font-size:12px;
    color:#ff3b3b;
    cursor:pointer;
}

/* CENTER */
.nav-center{
    flex:2;
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:#ffd700;
    white-space:nowrap;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

    <div class="title">KANJI SYSTEM 🇯🇵</div>
    <div class="line"></div>

    <div class="grid">

        <div class="btn" onclick="location.href='basic-kanji.html'">
            Basic Kanji
        </div>

        <div class="btn" onclick="location.href='n5-kanji.html'">
            JLPT N5 Kanji
        </div>

        <div class="btn" onclick="location.href='kanji-n4.html'">
            JLPT N4 Kanji
        </div>

        <div class="btn" onclick="location.href='jft-basic-kanji.html'">
            JFT Basic Kanji
        </div>

    </div>

    <!-- NAV (LOCKED STYLE) -->
    <div class="bottom-nav">

        <div class="nav-btn" onclick="history.back()">BACK</div>

        <div class="nav-center">← EWONZ LINGUA →</div>

        <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

    </div>

</div>

</body>
</html>
