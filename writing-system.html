<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EWONZ LINGUA - Japanese</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root{
      --bg1:#050505;
      --bg2:#0c0c0c;
      --bg3:#111111;
      --gold:#ffd700;
      --gold-dark:#b8860b;
      --red:#ff4d4d;
      --text:#ffffff;
      --muted:#d8d8d8;
      --glass:rgba(255,255,255,0.05);
      --border:rgba(255,215,0,0.42);
      --shadow:0 0 18px rgba(255,215,0,0.10);
      --sidebar-width:290px;
    }

    html,body{
      width:100%;
      height:100%;
      font-family:'Poppins',sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      color:var(--text);
      overflow:hidden;
      user-select:none;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:10px;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .app-shell{
      position: relative;
      z-index: 2;
      width:100%;
      max-width:390px;
      height: 92vh;
      display:flex;
      flex-direction:column;
    }

    .phone-frame{
      position:relative;
      width:100%;
      height:100%;
      border-radius:30px;
      overflow:hidden;
      background: rgba(8, 8, 8, 0.85);
      backdrop-filter: blur(10px);
      border:2px solid rgba(255,215,0,0.72);
      box-shadow:
        0 0 0 1px rgba(255,215,0,0.20),
        0 0 22px rgba(255,215,0,0.15),
        inset 0 0 18px rgba(255,215,0,0.05);
      padding:18px 14px;
      display: flex;
      flex-direction: column;
    }

    .topbar{
      position:relative;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      flex-shrink: 0;
    }

    .menu-btn{
      width:46px;
      height:46px;
      border-radius:14px;
      border:1.5px solid rgba(255,215,0,0.55);
      background:var(--glass);
      backdrop-filter:blur(10px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:5px;
      cursor:pointer;
      box-shadow:var(--shadow);
      flex-shrink:0;
    }

    .menu-btn span{
      width:20px;
      height:2.4px;
      border-radius999px;
      background:linear-gradient(90deg, var(--gold), var(--gold-dark));
      display:block;
    }

    .topbar-title{
      flex:1;
      text-align:center;
      padding-right:46px;
    }

    .topbar-title h1{
      font-size:19px;
      font-weight:700;
      letter-spacing:1px;
      color:rgba(255,215,0,0.78);
      text-transform:uppercase;
      line-height:1.2;
    }

    .shine-line{
      width:100%;
      height:2px;
      border-radius:999px;
      margin:10px 0 14px;
      background:linear-gradient(90deg, rgba(255,215,0,0.15), var(--gold), #fff1a8, var(--gold), rgba(255,215,0,0.15));
      box-shadow:0 0 8px rgba(255,215,0,0.16);
      flex-shrink: 0;
    }

    .content{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .content::-webkit-scrollbar {
      width: 4px;
    }
    .content::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 0, 0.3);
      border-radius: 999px;
    }

    .main-title{
      text-align:center;
      margin-bottom:8px;
      width:100%;
      flex-shrink: 0;
    }

    .main-title h2{
      font-size:21px;
      font-weight:700;
      color:#ffffff;
      letter-spacing:1.2px;
      text-transform: uppercase;
      line-height:1.25;
      margin-bottom:2px;
    }

    .japanese-grid{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:14px;
      padding-bottom: 20px;
    }

    /* බටන් මැදට ගැනීමට (justify-content: center) සහ position: relative යෙදීම */
    .btn{
      width:100%;
      padding: 20px 14px;
      font-size: 15px;
      font-weight:700;
      letter-spacing:0.8px;
      text-transform: uppercase;
      cursor:pointer;
      font-family:'Poppins',sans-serif;
      border-radius:16px;
      display: flex;
      align-items: center;
      justify-content: center; /* නම මැදට ගැනීමට */
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
    }

    .btn.open{
      background: var(--glass);
      border: 1.6px solid rgba(255,215,0,0.48);
      color: #ffffff;
      box-shadow: inset 0 0 12px rgba(255,215,0,0.04), 0 0 12px rgba(0,0,0,0.22);
    }

    .btn.locked{
      background:rgba(255,215,0,0.04);
      border:1.6px solid rgba(255,215,0,0.25);
      color:rgba(255,255,255,0.6);
    }

    /* Lock ටැග් එක බටන් එකේ දකුණු කෙළවරටම තැබීමට */
    .lock-tag{
      position: absolute;
      right: 14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:3px 9px;
      border-radius:999px;
      background:rgba(255,77,77,0.16);
      border:1px solid rgba(255,77,77,0.45);
      color:var(--red);
      font-size:11px;
      font-weight:700;
      letter-spacing:.6px;
      text-transform:uppercase;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.60);
      backdrop-filter:blur(3px);
      z-index:100;
      opacity:0;
      pointer-events:none;
      transition:.28s ease;
    }

    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .sidebar{
      position:fixed;
      top:0;
      left:calc(var(--sidebar-width) * -1 - 40px);
      width:var(--sidebar-width);
      max-width:84%;
      height:100vh;
      background:linear-gradient(180deg, rgba(12,12,12,0.98), rgba(18,18,18,0.98));
      border-right:1.5px solid rgba(255,215,0,0.38);
      box-shadow:12px 0 40px rgba(0,0,0,0.45);
      z-index:120;
      transition:left .32s ease;
      padding:18px 14px 18px;
      overflow-y:auto;
    }

    .sidebar.show{
      left:0;
    }

    .sidebar-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .brand-box h2{
      font-size:22px;
      color:var(--gold);
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
      line-height:1.2;
    }

    .brand-box p{
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
      line-height:1.55;
    }

    .close-btn{
      width:42px;
      height:42px;
      border-radius:14px;
      border:1.4px solid rgba(255,215,0,0.45);
      background:var(--glass);
      color:var(--gold);
      font-size:20px;
      font-weight:700;
      cursor:pointer;
      flex-shrink:0;
    }

    .sidebar-line{
      width:100%;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, transparent, var(--gold), #fff0a6, var(--gold), transparent);
      margin-bottom:14px;
    }

    .sidebar-top-nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin:4px 0 14px;
      padding:10px 10px;
      border-radius:16px;
      border:1.3px solid rgba(255,215,0,0.28);
      background:var(--glass);
    }

    .sidebar-nav-btn{
      text-decoration:none;
      color:var(--red);
      font-size:11px;
      font-weight:700;
      letter-spacing:.7px;
      text-transform:uppercase;
      white-space:nowrap;
      width: 60px;
    }
    
    .sidebar-nav-btn:last-child {
      text-align: right;
    }

    .sidebar-nav-title{
      flex:1;
      text-align:center;
      color:var(--gold);
      font-size:12px;
      font-weight:800;
      letter-spacing:.8px;
      text-transform:uppercase;
      line-height: 1;
    }

    .menu-label{
      font-size:12px;
      font-weight:800;
      color:var(--gold);
      letter-spacing:.8px;
      text-transform:uppercase;
      margin:16px 4px 10px;
    }

    .menu-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .menu-item{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 14px;
      border-radius:16px;
      border:1.3px solid rgba(255,215,0,0.25);
      background:var(--glass);
      color:var(--text);
      font-size:14px;
      font-weight:600;
      text-decoration:none;
      cursor:pointer;
    }

    .menu-item .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .menu-item .icon{
      width:34px;
      height:34px;
      border-radius:12px;
      border:1px solid rgba(255,215,0,0.28);
      background:rgba(255,255,255,0.04);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      color:var(--gold);
      flex-shrink:0;
    }

    .menu-item .arrow{
      color:var(--gold);
      font-size:14px;
      flex-shrink:0;
      transition: transform 0.2s ease;
    }

    .menu-item.active .arrow {
      transform: rotate(180deg);
    }

    .submenu{
      display:none;
      flex-direction:column;
      gap:8px;
      padding:4px 0 4px 10px;
    }

    .submenu.show{
      display:flex;
    }

    .submenu-item{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      border-radius:14px;
      border:1.2px solid rgba(255,215,0,0.20);
      background:rgba(255,255,255,0.04);
      color:var(--text);
      text-decoration:none;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
    }

    .submenu-item .sub-left{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .settings-box {
      border: 1.3px solid rgba(255,215,0,0.25);
      background: var(--glass);
      border-radius: 18px;
      padding: 10px 14px;
    }

    .settings-box h4{
      color:var(--gold);
      font-size:13px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.7px;
      margin-bottom:6px;
      margin-top: 4px;
    }

    .setting-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:11px 0;
      border-bottom:1px solid rgba(255,215,0,0.12);
    }

    .setting-row:last-child{
      border-bottom:none;
      padding-bottom:4px;
    }

    .setting-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .setting-icon{
      width:34px;
      height:34px;
      border-radius:12px;
      border:1px solid rgba(255,215,0,0.28);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--gold);
      background:rgba(255,255,255,0.04);
      flex-shrink:0;
      font-size:15px;
    }

    .setting-text{
      font-size:13px;
      font-weight:600;
      color:var(--text);
    }

    .toggle{
      position:relative;
      width:52px;
      height:30px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,215,0,0.28);
      cursor:pointer;
      flex-shrink:0;
    }

    .toggle::before{
      content:"";
      position:absolute;
      top:3px;
      left:3px;
      width:22px;
      height:22px;
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 8px rgba(255,215,0,0.25);
      transition:.25s ease;
    }

    .toggle.active{
      background:rgba(255,215,0,0.20);
    }

    .toggle.active::before{
      left:25px;
    }

    .countdown-value{
      font-size:11px;
      color:var(--gold);
      font-weight:700;
      text-align:right;
      line-height:1.5;
      max-width:120px;
    }

    .sidebar-footer{
      margin-top:20px;
      padding:14px;
      border-radius:18px;
      border:1.3px solid rgba(255,215,0,0.24);
      background:var(--glass);
      text-align:center;
    }

    .sidebar-footer .footer-title{
      color:var(--gold);
      font-size:13px;
      font-weight:800;
      margin-bottom:6px;
      text-transform:uppercase;
      letter-spacing:.6px;
    }

    .sidebar-footer p{
      font-size:11px;
      color:var(--muted);
      line-height:1.7;
    }

    .popup-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.72);
      backdrop-filter:blur(4px);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      z-index:300;
      opacity:0;
      pointer-events:none;
      transition:.25s ease;
    }

    .popup-overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .popup-box{
      width:100%;
      max-width:360px;
      border-radius:24px;
      padding:22px 18px 18px;
      background:linear-gradient(180deg, rgba(16,16,16,0.98), rgba(10,10,10,0.98));
      border:1.6px solid rgba(255,215,0,0.55);
      box-shadow:0 0 30px rgba(255,215,0,0.14);
      text-align:center;
    }

    .popup-box h3{
      color:var(--gold);
      font-size:22px;
      font-weight:800;
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .popup-box p{
      font-size:13px;
      color:var(--muted);
      line-height:1.8;
      margin-bottom:14px;
    }

    .countdown{
      font-size:13px;
      font-weight:700;
      color:var(--gold);
      line-height:1.8;
      margin-bottom:16px;
    }

    .popup-btn{
      width:100%;
      min-height:48px;
      border-radius:14px;
      border:1.5px solid rgba(255,215,0,0.55);
      background:rgba(255,215,0,0.08);
      color:var(--gold);
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    @media (max-width:380px){
      .phone-frame{padding:16px 12px 20px;}
      .main-title h2{font-size:18px;}
      .topbar-title h1{font-size:17px;}
      .sidebar{width:280px;}
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand-box">
        <h2>EWONZ LINGUA</h2>
        <p>Premium Language Learning Platform</p>
      </div>
      <button class="close-btn" id="closeSidebarBtn">✕</button>
    </div>

    <div class="sidebar-line"></div>

    <div class="sidebar-top-nav">
      <a href="language.html" class="sidebar-nav-btn">← BACK</a>
      <div class="sidebar-nav-title">EWONZ LINGUA</div>
      <a href="index.html" class="sidebar-nav-btn">HOME →</a>
    </div>

    <div class="menu-label">Main Menu</div>

    <div class="menu-list">
      <div class="menu-item" id="languageToggle">
        <div class="left">
          <div class="icon">🌐</div>
          <span>Language</span>
        </div>
        <span class="arrow">⌄</span>
      </div>

      <div class="submenu" id="languageSubmenu">
        <a href="japanese.html" class="submenu-item">
          <div class="sub-left">
            <span>🇯🇵</span>
            <span>Japanese</span>
          </div>
        </a>

        <a href="chinese.html" class="submenu-item">
          <div class="sub-left">
            <span>🇨🇳</span>
            <span>Chinese</span>
          </div>
          <span class="lock-tag">LOCK</span>
        </a>

        <a href="korean.html" class="submenu-item">
          <div class="sub-left">
            <span>🇰🇷</span>
            <span>Korean</span>
          </div>
          <span class="lock-tag">LOCK</span>
        </a>
      </div>

      <a href="studyplan.html" class="menu-item">
        <div class="left">
          <div class="icon">📅</div>
          <span>Study Plan</span>
        </div>
      </a>

      <a href="about.html" class="menu-item">
        <div class="left">
          <div class="icon">ℹ️</div>
          <span>About</span>
        </div>
      </a>

      <div class="menu-item" id="settingsToggle">
        <div class="left">
          <div class="icon">⚙️</div>
          <span>Settings</span>
        </div>
        <span class="arrow">⌄</span>
      </div>

      <div class="submenu" id="settingsSubmenu">
        <div class="settings-box">
          <h4>Settings</h4>

          <div class="setting-row">
            <div class="setting-left">
              <div class="setting-icon">🌙</div>
