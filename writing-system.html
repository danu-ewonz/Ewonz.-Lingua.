<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* BLOCK */
*{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#0b0b0b;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Poppins', sans-serif;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* GOLD BORDER ANIMATION */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* CONTENT */
.content{
    display:flex;
    flex-direction:column;
    height:100%;
}

/* TITLE */
.title{
    text-align:center;
    color:#e6e6e6;
    font-size:18px;
    font-weight:700;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID SCROLL */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:12px;
    background:#111;
    color:#fff;
    border-radius:10px;

    font-family:'Montserrat', sans-serif;
    font-size:12px;
    font-weight:600;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:1px;

    border:2px solid #b8860b;
    cursor:pointer;
}

.btn:active{
    background:#b8860b;
    color:#000;
}

/* SCROLLBAR */
.grid::-webkit-scrollbar{
    width:3px;
}

.grid::-webkit-scrollbar-thumb{
    background:#b8860b;
    border-radius:10px;
}

/* =========================
GLOBAL NAV SYSTEM (LOCKED DESIGN)
========================= */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);
}

/* ITEMS */
.nav-item,
.nav-center{
    flex:1;
    text-align:center;

    font-weight:700;
    letter-spacing:1px;
    white-space:nowrap;
}

/* LEFT + RIGHT */
.nav-item{
    color:#ff3b3b;
    font-size:13px;
    cursor:pointer;
    transition:0.2s ease;
}

/* CENTER */
.nav-center{
    color:#ffd700;
    font-size:12px;
}

/* TOUCH EFFECT */
.nav-item:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<!-- FRAME -->
<div class="frame">

    <div class="title">WRITING SYSTEM</div>
    <div class="line"></div>

    <div class="grid">

        <div class="btn" onclick="location.href='hiragana.html'">Hiragana</div>
        <div class="btn" onclick="location.href='katakana.html'">Katakana</div>
        <div class="btn" onclick="location.href='kanji.html'">Kanji</div>
        <div class="btn" onclick="location.href='hiragana-special.html'">Hiragana Special</div>
        <div class="btn" onclick="location.href='katakana-special.html'">Katakana Special</div>

    </div>

</div>

<!-- OUTSIDE NAV (LOCKED SYSTEM) -->
<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">
        BACK
    </div>

    <div class="nav-center">
        ← EWONZ LINGUA →
    </div>

    <div class="nav-item" onclick="location.href='index.html'">
        HOME
    </div>

</div>

</body>
</html>
