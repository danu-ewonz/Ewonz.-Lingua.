<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Exam Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

/* FULL SCREEN */
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* CENTER */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;
}

/* FRAME (STRICT 9:16) */
.frame{
    width:360px;
    aspect-ratio:9/16;
    max-height:100vh;

    background:url("1781280463236_edit_59479765463083.png") center/cover no-repeat;

    border-radius:20px;
    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;
}

/* DARK LAYER */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:1;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(
        90deg,
        #b8860b,
        #ffd700,
        #b8860b,
        #8b6508,
        #ffd700
    );

    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
    z-index:3;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
}

/* SUBTITLE */
.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:10px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID - MOVED UP */
.grid{
    display:flex;
    flex-direction:column;
    gap:14px;

    padding:14px 18px;

    /* 🔥 MOVE UP FIX */
    margin-top:10px;
}

/* BUTTON */
.btn{
    padding:20px 14px;

    background:rgba(0,0,0,0.55);
    border:2px solid #b8860b;
    border-radius:12px;

    color:#fff;
    font-size:16px;
    font-weight:700;

    text-align:center;
    text-transform:uppercase;
}

/* ACTIVE */
.btn:active{
    transform:scale(0.97);
    background:#ffd700;
    color:#000;
}

/* PUSH NAV DOWN */
.spacer{
    flex:1;
}

/* NAV */
.bottom-nav{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;
    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.25);
}

.nav-btn{
    flex:1;
    text-align:center;
    color:#ff3b3b;
    font-size:13px;
    font-weight:700;
}

.center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%}
    100%{background-position:200%}
}

</style>
</head>

<body>

<div class="frame">

    <div class="content">

        <div class="title">EXAM</div>
        <div class="subtitle">SELECT EXAM TYPE</div>

        <div class="line"></div>

        <!-- 🔼 BUTTONS UP -->
        <div class="grid">

            <div class="btn" onclick="location.href='jlpt-exam.html'">JLPT EXAM</div>
            <div class="btn" onclick="location.href='nat-exam.html'">NAT-TEST EXAM</div>
            <div class="btn" onclick="location.href='jft-exam.html'">JFT-BASIC EXAM</div>
            <div class="btn" onclick="location.href='exam-features.html'">EXAM FEATURES</div>

        </div>

        <div class="spacer"></div>

        <div class="bottom-nav">

            <div class="nav-btn" onclick="history.back()">BACK</div>

            <div class="center">← EWONZ LINGUA →</div>

            <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

        </div>

    </div>

</div>

</body>
</html>
