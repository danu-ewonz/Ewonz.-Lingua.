<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Writing System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* CENTER SCREEN */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;
}

/* FRAME ONLY (BACKGROUND INSIDE HERE) */
.frame{
    width:360px;
    aspect-ratio:9/16;

    position:relative;
    overflow:hidden;
    border-radius:20px;

    display:flex;
    flex-direction:column;
}

/* 🔥 BACKGROUND ONLY INSIDE FRAME */
.frame-bg{
    position:absolute;
    inset:0;

    background:url("1781280403507_edit_59454179593850.png") center/cover no-repeat;

    z-index:0;
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:1;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(
        90deg,
        #b8860b,
        #ffd700,
        #b8860b,
        #8b6508,
        #ffd700
    );

    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
    z-index:3;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
}

/* SUBTITLE */
.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:10px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID TOP */
.grid{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:12px;
    padding:14px 18px;
    margin-top:10px;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    border:2px solid #b8860b;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:16px;
    font-weight:700;

    cursor:pointer;

    /* IMPORTANT */
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);

    transition:0.3s;
    }

/* CLICK */
.btn:active{
    transform:scale(0.97);
    background:#ffd700;
    color:#000;
}

/* NAV */
.bottom-nav{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;
    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.25);
}

.nav-btn{
    flex:1;
    text-align:center;
    color:#ff3b3b;
    font-size:13px;
    font-weight:700;
}

.center{
    flex:2;
    text-align:center;
    color:#ffd700;
    font-size:12px;
    font-weight:700;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%}
    100%{background-position:200%}
}

</style>
</head>

<body>

<div class="frame">

    <!-- 🔥 ONLY FRAME BACKGROUND -->
    <div class="frame-bg"></div>

    <div class="content">

        <div class="title">WRITING SYSTEM</div>
        <div class="subtitle">SELECT CATEGORY</div>

        <div class="line"></div>

        <div class="grid">

            <div class="btn" onclick="location.href='hiragana.html'">HIRAGANA</div>
            <div class="btn" onclick="location.href='katakana.html'">KATAKANA</div>
            <div class="btn" onclick="location.href='kanji.html'">KANJI</div>
            <div class="btn" onclick="location.href='hiragana-special.html'">HIRAGANA SPECIAL</div>
            <div class="btn" onclick="location.href='katakana-special.html'">KATAKANA SPECIAL</div>

        </div>

        <div class="bottom-nav">

            <div class="nav-btn" onclick="history.back()">BACK</div>

            <div class="center">← EWONZ LINGUA →</div>

            <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

        </div>

    </div>

</div>

</body>
</html>
