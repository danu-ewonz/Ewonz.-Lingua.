<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* BLOCK */
*{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Poppins', sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* GOLD BORDER ANIMATION */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#e6e6e6;
    font-size:18px;
    font-weight:700;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
    flex:1;
    overflow-y:auto;
}

/* BUTTON */
.btn{
    padding:12px;
    background:#111;
    color:#fff;
    border-radius:10px;

    font-family:'Montserrat', sans-serif;
    font-size:12px;
    font-weight:600;

    text-align:center;
    text-transform:uppercase;
    letter-spacing:1px;

    border:2px solid #b8860b;
    cursor:pointer;
    position:relative;
}

/* BUTTON ACTIVE */
.btn:active{
    background:#b8860b;
    color:#000;
}

/* NAV */
.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:10px 14px;
    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.15);
}

/* INNER BORDER BOX */
.bottom-nav::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(255,215,0,0.25);
    border-radius:10px;
    pointer-events:none;
}

/* ALL ITEMS SAME SIZE */
.nav-item,
.nav-center,
.nav-right{
    flex:1;
    text-align:center;

    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    white-space:nowrap;

    position:relative;
    z-index:2;
}

/* LEFT + RIGHT */
.nav-item,
.nav-right{
    color:#ff3b3b;
    cursor:pointer;
    transition:0.2s ease;
}

/* CENTER ANIMATION */
.nav-center{
    color:#ffd700;
    font-size:12px;
    cursor:default;

    animation:softBreath 3.5s ease-in-out infinite;
}

/* TOUCH GOLD EFFECT */
.nav-item:active,
.nav-right:active{
    color:#ffd700;
    transform:scale(0.94);
    opacity:1;
}

/* ANIMATION */
@keyframes softBreath{
    0%{
        transform:scale(1);
        opacity:0.85;
    }
    50%{
        transform:scale(1.04);
        opacity:1;
    }
    100%{
        transform:scale(1);
        opacity:0.85;
    }
}

/* SHINE FRAME */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">WRITING SYSTEM</div>
<div class="line"></div>

<div class="grid">

    <div class="btn" onclick="location.href='hiragana.html'">Hiragana</div>
    <div class="btn" onclick="location.href='katakana.html'">Katakana</div>
    <div class="btn" onclick="location.href='kanji.html'">Kanji</div>
    <div class="btn" onclick="location.href='hiragana-special.html'">Hiragana Special</div>
    <div class="btn" onclick="location.href='katakana-special.html'">Katakana Special</div>

</div>

<!-- NEW NAV (REPLACED) -->
<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">
        BACK
    </div>

    <div class="nav-center">
        ← EWONZ LINGUA →
    </div>

    <div class="nav-right" onclick="location.href='index.html'">
        HOME
    </div>

</div>

</div>

</body>
</html>
