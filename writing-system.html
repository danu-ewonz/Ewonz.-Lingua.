<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

/* BODY */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0b0b0b;
    font-family:'Poppins',sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    background:#0a0a0a;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:18px;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* CONTENT */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:15px;
}

/* BUTTONS */
.btn{
    padding:14px;
    background:#111;
    color:#fff;
    border-radius:10px;
    border:2px solid #b8860b;
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
}

.btn:active{
    background:#b8860b;
    color:#000;
}

/* ========================= */
/* 🔥 FIXED BACK / HOME NAV */
/* ========================= */

.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.25);

    flex-shrink:0;
}

/* BUTTON STYLE */
.nav-btn{
    flex:1;
    text-align:center;

    font-weight:700;
    font-size:13px;

    color:#ff3b3b;
    cursor:pointer;

    background:transparent;
    border:none;
}

/* CENTER TEXT */
.nav-center{
    flex:2;
    text-align:center;

    font-size:12px;
    font-weight:700;

    color:#ffd700;
    white-space:nowrap;
}

/* CLICK EFFECT */
.nav-btn:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

    <!-- TITLE -->
    <div class="title">WRITING SYSTEM</div>
    <div class="line"></div>

    <!-- CONTENT -->
    <div class="grid">

        <div class="btn" onclick="location.href='hiragana.html'">Hiragana</div>
        <div class="btn" onclick="location.href='katakana.html'">Katakana</div>
        <div class="btn" onclick="location.href='kanji.html'">Kanji</div>
        <div class="btn" onclick="location.href='hiragana-special.html'">Hiragana Special</div>
        <div class="btn" onclick="location.href='katakana-special.html'">Katakana Special</div>

    </div>

    <!-- NAV (INSIDE FRAME - FIXED) -->
    <div class="bottom-nav">

        <div class="nav-btn" onclick="history.back()">BACK</div>

        <div class="nav-center">← EWONZ LINGUA →</div>

        <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

    </div>

</div>

</body>
</html>
