<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Chart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#0b0b0b;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Poppins', sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE (FIXED HEIGHT) */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    padding-top:15px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* ✅ SCROLL AREA FIXED */
.content{
    flex:1;
    overflow-y:auto;   /* 🔥 MAIN FIX */
    padding:10px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    text-align:center;
}

td{
    border:1px solid rgba(184,134,11,0.6);
    padding:10px;
}

.jp{
    font-size:20px;
    font-weight:700;
    color:#fff;
}

.rm{
    font-size:10px;
    color:#b8860b;
}

/* SCROLLBAR */
.content::-webkit-scrollbar{
    width:4px;
}

.content::-webkit-scrollbar-thumb{
    background:#b8860b;
    border-radius:10px;
}

/* NAV */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);

    white-space:nowrap;
}

.nav-btn{
    flex:1;
    text-align:center;

    color:red;
    font-weight:700;
    font-size:13px;

    cursor:pointer;
    white-space:nowrap;
}

.center{
    flex:1;
    text-align:center;

    color:#ffd700;
    font-weight:700;
    font-size:12px;

    white-space:nowrap;
}

.nav-btn:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">KATAKANA CHART 🇯🇵</div>
<div class="line"></div>

<!-- 🔥 FIXED SCROLL AREA -->
<div class="content">
