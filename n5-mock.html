<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Mock Exam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

/* BODY */
body{
    font-family:Poppins;
    background:radial-gradient(circle,#0a0a12,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;
    background:rgba(10,10,18,0.95);
    border-radius:20px;
    overflow:hidden;
    position:relative;
}

/* ANIMATED BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:2px;
    background:linear-gradient(90deg,#ffd700,#b8860b,#fff3a0,#ffd700);
    background-size:300% 300%;
    animation:borderMove 4s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

@keyframes borderMove{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
}

/* HEADER */
.header{
    text-align:center;
    padding-top:20px;
    font-size:18px;
    font-weight:700;
    color:#fff;
}

/* SUB TITLE */
.sub{
    text-align:center;
    font-size:11px;
    color:#b8860b;
    margin-top:4px;
}

/* LINE */
.line{
    width:100%;
    height:2px;
    margin-top:8px;
    background:linear-gradient(90deg,transparent,#ffd700,transparent);
    animation:shine 2s infinite;
}

@keyframes shine{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

/* CONTENT */
.content{
    padding:10px;
    height:500px;
    overflow-y:auto;
}

/* BUTTON */
.btn{
    width:100%;
    padding:20px 14px;
    margin-bottom:10px;
    border-radius:10px;
    border:2px solid #ffd700;
    background:#1a1a2a;
    color:#fff;
    font-weight:700;
    text-align:center;
    transition:0.2s;
}

/* TOUCH EFFECT */
.btn:active{
    background:linear-gradient(145deg,#b8860b,#ffd700);
    color:#000;
    transform:scale(1.02);
}

/* NAV */
.nav{
    position:absolute;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:rgba(0,0,0,0.6);
    border-top:1px solid rgba(255,215,0,0.2);
}

.nav button{
    background:none;
    border:none;
    color:#ff3b3b;
    font-weight:700;
    font-size:13px;
}

.center{
    color:#ffd700;
    font-weight:700;
    font-size:13px;
}

</style>
</head>

<body>

<div class="frame">

    <!-- HEADER -->
    <div class="header">Japanese Mock Exam</div>

    <!-- SUB TITLE -->
    <div class="sub">Make By Danu Ewonz</div>

    <!-- LINE -->
    <div class="line"></div>

    <!-- CONTENT -->
    <div class="content">

        <button class="btn" onclick="openPaper(1)">JLPT - N5 Paper - 1</button>
        <button class="btn" onclick="openPaper(2)">JLPT - N5 Paper - 2</button>
        <button class="btn" onclick="openPaper(3)">JLPT - N5 Paper - 3</button>
        <button class="btn" onclick="openPaper(4)">JLPT - N5 Paper - 4</button>
        <button class="btn" onclick="openPaper(5)">JLPT - N5 Paper - 5</button>
        <button class="btn" onclick="openPaper(6)">JLPT - N5 Paper - 6</button>
        <button class="btn" onclick="openPaper(7)">JLPT - N5 Paper - 7</button>
        <button class="btn" onclick="openPaper(8)">JLPT - N5 Paper - 8</button>
        <button class="btn" onclick="openPaper(9)">JLPT - N5 Paper - 9</button>
        <button class="btn" onclick="openPaper(10)">JLPT - N5 Paper - 10</button>

    </div>

    <!-- NAV -->
    <div class="nav">
        <button onclick="history.back()">BACK</button>
        <div class="center">← EWONZ LINGUA →</div>
        <button onclick="location.href='index.html'">HOME</button>
    </div>

</div>

<script>

function openPaper(id){
    window.location.href = "paper" + id + ".html";
}

</script>

</body>
</html>
