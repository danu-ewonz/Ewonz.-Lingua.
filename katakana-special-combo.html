<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Katakana Special Combo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

body{
    margin:0;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Poppins', sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:15px;
}

/* SUBTITLE */
.subtitle{
    text-align:center;
    color:#b8860b;
    font-size:12px;
    font-weight:600;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    padding:10px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* SECTION */
.section{
    background:#111;
    border:1px solid #b8860b;
    border-radius:10px;
    padding:10px;
}

/* HEADER CENTERED */
.h{
    color:#ffd700;
    font-size:12px;
    font-weight:700;
    margin-bottom:8px;
    text-align:center;
}

/* 🔥 ROW WITH PROPER GAP SYSTEM */
.row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    font-size:13px;
    padding:5px 0;
}

/* JAPANESE */
.jp{
    text-align:right;
    color:#fff;
    font-weight:600;
    padding-right:18px;   /* 🔥 GAP FIX */
}

/* ARROW */
.arrow{
    text-align:center;
    color:#ffd700;
    font-weight:700;
    padding:0 12px;       /* 🔥 GAP FIX */
}

/* ROMAJI */
.rm{
    text-align:left;
    color:#aaa;
    padding-left:18px;    /* 🔥 GAP FIX */
}

/* NAV */
.bottom-nav{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    padding:10px 0;
    border-top:1px solid rgba(255,215,0,0.15);
}

.nav-text{
    color:red;
    font-weight:700;
}

.center{
    color:#b8860b;
    font-weight:700;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">KATAKANA SPECIAL COMBO</div>
<div class="subtitle">FOREIGN SOUNDS</div>

<div class="line"></div>

<div class="grid">

<!-- F SOUND -->
<div class="section">
    <div class="h">F SOUND</div>

    <div class="row"><div class="jp">ファ</div><div class="arrow">→</div><div class="rm">fa</div></div>
    <div class="row"><div class="jp">フィ</div><div class="arrow">→</div><div class="rm">fi</div></div>
    <div class="row"><div class="jp">フェ</div><div class="arrow">→</div><div class="rm">fe</div></div>
    <div class="row"><div class="jp">フォ</div><div class="arrow">→</div><div class="rm">fo</div></div>
</div>

<!-- W SOUND -->
<div class="section">
    <div class="h">W SOUND</div>

    <div class="row"><div class="jp">ウィ</div><div class="arrow">→</div><div class="rm">wi</div></div>
    <div class="row"><div class="jp">ウェ</div><div class="arrow">→</div><div class="rm">we</div></div>
    <div class="row"><div class="jp">ウォ</div><div class="arrow">→</div><div class="rm">wo</div></div>
</div>

<!-- V SOUND -->
<div class="section">
    <div class="h">V SOUND</div>

    <div class="row"><div class="jp">ヴァ</div><div class="arrow">→</div><div class="rm">va</div></div>
    <div class="row"><div class="jp">ヴィ</div><div class="arrow">→</div><div class="rm">vi</div></div>
    <div class="row"><div class="jp">ヴ</div><div class="arrow">→</div><div class="rm">vu</div></div>
    <div class="row"><div class="jp">ヴェ</div><div class="arrow">→</div><div class="rm">ve</div></div>
    <div class="row"><div class="jp">ヴォ</div><div class="arrow">→</div><div class="rm">vo</div></div>
</div>

</div>

<div class="bottom-nav">
    <div class="nav-text">← BACK →</div>
    <div class="center">EWONZ LINGUA</div>
    <div class="nav-text">→ HOME →</div>
</div>

</div>

</body>
</html>
