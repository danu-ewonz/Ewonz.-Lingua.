<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JFT BASIC FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    height:100%;
    overflow:hidden;
}

/* BODY */
body{
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Poppins;
    gap:10px;
}

/* FRAME (9:16 FIX + BACKGROUND) */
.frame{
    width:360px;
    height:640px;

    background:url("1781343118911_edit_121338157887847.png") center/cover no-repeat;

    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:0;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;
    z-index:1;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
}

/* HEADER */
.header{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:16px;
    position:relative;
    z-index:2;
}

.sub{
    text-align:center;
    color:#b8860b;
    font-size:12px;
    margin-top:4px;
    font-weight:600;
    position:relative;
    z-index:2;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
    position:relative;
    z-index:2;
}

/* SCROLL AREA */
.grid{
    position:absolute;
    top:80px;
    bottom:70px;
    left:0;
    right:0;

    overflow-y:auto;
    padding:12px;

    z-index:2;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    margin-bottom:10px;
    border-radius:10px;
    background:#111;
    border:2px solid #b8860b;
    color:#fff;

    text-align:center;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
}

.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

/* =========================
GLASS NAV (iPhone STYLE FIX)
========================= */
.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 14px;

    position:absolute;
    bottom:0;
    left:0;
    z-index:3;

    background:rgba(10,10,10,0.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-top:1px solid rgba(255,215,0,0.18);
    box-shadow:0 -5px 25px rgba(0,0,0,0.4);
}

/* NAV ITEMS */
.nav-btn{
    width:70px;
    text-align:center;
    color:#ff3b3b;
    font-weight:700;
    font-size:13px;
}

.nav-center{
    flex:1;
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:13px;
}

/* TOUCH */
.nav-btn:active{
    transform:scale(0.95);
    color:#ffd700;
}

/* ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="header">JFT-BASIC EXAM</div>
<div class="sub">SELECT EXAM DETAILS</div>
<div class="line"></div>

<div class="grid">

    <div class="btn">OVERALL LEVEL</div>
    <div class="btn">MAIN SKILL AREAS</div>
    <div class="btn">EXAM FOCUS AREAS</div>
    <div class="btn">TEST FORMAT</div>

</div>

<!-- NAV INSIDE FRAME -->
<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">BACK</div>

    <div class="nav-center">← EWONZ LINGUA →</div>

    <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</div>

</body>
</html>
