<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAT Exam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    background:#0b0b0b;
    font-family:Poppins;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:10px;
}

/* FRAME (9:16) */
.frame{
    width:360px;
    height:640px;

    background:url("1781342915127_edit_121136377772065.png") center/cover no-repeat;

    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* DARK OVERLAY */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:0;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;
    z-index:1;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100%;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
}

.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
    font-weight:600;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:10px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    border-radius:10px;
    background:#111;
    color:#fff;
    font-size:16px;
    font-weight:700;
    text-align:center;
    border:2px solid #b8860b;
}

.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

/* =========================
NAV (FULL FIX 🔥 CENTER PERFECT)
========================= */
.bottom-nav{
    width:100%;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    position:absolute;
    bottom:0;
    left:0;
    z-index:3;

    background:rgba(10,10,10,0.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-top:1px solid rgba(255,215,0,0.18);
    box-shadow:0 -5px 25px rgba(0,0,0,0.4);
}

/* LEFT + RIGHT FIXED WIDTH */
.nav-item{
    width:70px;
    text-align:center;
    color:#ff3b3b;
    font-size:13px;
    font-weight:700;
}

/* CENTER PERFECT MIDDLE */
.nav-center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:#ffd700;
    font-size:12px;
    font-weight:700;
}

/* TOUCH EFFECT */
.nav-item:active{
    transform:scale(0.95);
    color:#ffd700;
}

/* ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="content">

    <div class="title">NAT EXAM</div>
    <div class="subtitle">SELECT NAT EXAM LEVEL</div>

    <div class="line"></div>

    <div class="grid">

        <div class="btn">Q5</div>
        <div class="btn">Q4</div>
        <div class="btn">Q3</div>
        <div class="btn">Q2</div>
        <div class="btn">Q1</div>

    </div>

</div>

<!-- NAV INSIDE FRAME -->
<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">BACK</div>

    <div class="nav-center">← EWONZ LINGUA →</div>

    <div class="nav-item" onclick="location.href='index.html'">HOME</div>

</div>

</div>

</body>
</html>
