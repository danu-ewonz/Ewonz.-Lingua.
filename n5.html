<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JLPT N5</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

body{
    font-family:Poppins;
    background:radial-gradient(circle,#0a0a12,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;
    background:rgba(10,10,18,0.95);
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* ANIMATED BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:2px;
    background:linear-gradient(90deg,#ffd700,#b8860b,#fff3a0,#b8860b);
    background-size:300% 300%;
    animation:borderMove 4s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

@keyframes borderMove{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
}

/* TITLE */
.title{
    text-align:center;
    padding-top:25px;
    font-size:18px;
    font-weight:700;
    color:#fff;
}

/* LINE */
.title-line{
    width:100%;
    height:2px;
    margin-top:8px;
    background:linear-gradient(90deg,transparent,#ffd700,transparent);
    animation:shine 2s infinite;
}

@keyframes shine{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

/* CONTENT */
.content{
    padding:10px;
    height:500px;
    overflow-y:auto;
}

/* BUTTON */
.btn{
    width:90%;
    margin:10px auto;
    display:block;
    padding:20px 14px;
    border-radius:12px;
    border:2px solid #b8860b;
    background:#1a1a2a;
    color:#fff;
    font-size:16px;
    font-weight:600;
    text-align:center;
    transition:0.2s;
}

/* ACTIVE EFFECT */
.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(1.02);
}

/* NAV */
.nav{
    position:absolute;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:rgba(0,0,0,0.6);
    border-top:1px solid rgba(255,215,0,0.2);
}

.nav button{
    background:none;
    border:none;
    color:#ff3b3b;
    font-weight:700;
    font-size:13px;
}

.center{
    color:#ffd700;
    font-weight:700;
    font-size:13px;
}

</style>
</head>

<body>

<div class="frame">

    <!-- TITLE -->
    <div class="title">JLPT - N5 EXAM</div>

    <!-- LINE -->
    <div class="title-line"></div>

    <!-- CONTENT -->
    <div class="content">

        <button class="btn" onclick="location.href='n5-mock.html'">Japanese Mock Paper</button>

        <button class="btn" onclick="alert('Sample Test 1')">Sample Test 1</button>
        <button class="btn" onclick="alert('Sample Test 2')">Sample Test 2</button>
        <button class="btn" onclick="alert('Sample Test 3')">Sample Test 3</button>
        <button class="btn" onclick="alert('Sample Test 4')">Sample Test 4</button>

    </div>

    <!-- NAV -->
    <div class="nav">
        <button onclick="history.back()">BACK</button>
        <div class="center">← EWONZ LINGUA →</div>
        <button onclick="location.href='index.html'">HOME</button>
    </div>

</div>

</body>
</html>
