<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

*{
    -webkit-user-select:none;
    user-select:none;
}

body{
    margin:0;
    font-family:Poppins;
    background:radial-gradient(circle,#0a0a12,#000);
    display:flex;
    justify-content:center;
    color:white;
}

/* FRAME */
.frame{
    width:360px;
    height:640px;
    margin-top:20px;
    background:rgba(10,10,18,0.95);
    border-radius:20px;
    overflow:hidden;
    position:relative;

    /* ANIMATED BORDER */
    border:2px solid transparent;
    background-clip:padding-box;
}

.frame::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    border-radius:20px;
    padding:2px;
    background:linear-gradient(90deg,#ffd700,#b8860b,#ffd700,#fff3a0);
    background-size:300% 300%;
    animation:borderMove 4s linear infinite;
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}

@keyframes borderMove{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
}

/* TITLE */
.title{
    text-align:center;
    padding-top:30px;
    font-size:18px;
    font-weight:bold;
    color:white;
}

/* FULL WIDTH TITLE LINE */
.title-line{
    width:100%;
    height:2px;
    margin-top:8px;
    background:linear-gradient(90deg,transparent,#ffd700,transparent);
    animation:shine 2s infinite;
}

@keyframes shine{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

/* BUTTON */
.btn{
    width:90%;
    margin:60px 5%;
    padding:18px;
    border-radius:12px;
    border:2px solid #ffd700;
    background:#1a1a2a;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

/* TOUCH GOLD EFFECT */
.btn:active{
    background:linear-gradient(145deg,#b8860b,#ffd700);
    color:#000;
    transform:scale(1.02);
}

/* NAV */
.nav{
    position:absolute;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:rgba(0,0,0,0.6);
    border-top:1px solid rgba(255,215,0,0.2);
}

.nav button{
    background:none;
    border:none;
    color:red;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.center{
    color:#ffd700;
    font-weight:bold;
    font-size:13px;
}

</style>
</head>

<body>

<div class="frame">

    <!-- TITLE -->
    <div class="title">JLPT - N5 EXAM</div>

    <!-- FULL WIDTH LINE -->
    <div class="title-line"></div>

    <!-- BUTTON -->
    <button class="btn" onclick=mock.html">
         Japanese Mock Paper
    </button>

    <!-- NAV -->
    <div class="nav">
        <button onclick="goBack()">BACK</button>
        <div class="center">← EWONZ LINGUA →</div>
        <button onclick="goHome()">HOME</button>
    </div>

</div>

<script>

function openPaper(){
    window.location.href = "paper1.html";
}

function goBack(){
    window.history.back();
}

function goHome(){
    window.location.href = "index.html";
}

</script>

</body>
</html>
