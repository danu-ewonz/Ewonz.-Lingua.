<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hiragana Chart Fixed</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    background:#0b0b0b;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:'Poppins', sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:14px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* CONTENT FIX */
.content{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

/* TABLE FIX (IMPORTANT) */
table{
    width:100%;
    border-collapse:collapse;
    text-align:center;
    table-layout:fixed;
}

td{
    border:1px solid rgba(184,134,11,0.6);
    padding:12px;
    vertical-align:middle;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
}

/* JAPANESE CHARACTER FIX */
.jp{
    font-size:22px;
    font-weight:700;
    color:#ffffff;
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    display:block;
}

/* ROMAJI */
.rm{
    font-size:11px;
    color:#b8860b;
    display:block;
    margin-top:2px;
}

/* NAV OUTSIDE */
.nav-container{
    width:360px;
    margin-top:10px;
}

.nav-line{
    height:1px;
    background:rgba(255,215,0,0.3);
}

.bottom-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
}

.nav-btn{
    color:red;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}

.center{
    color:#ffd700;
    font-weight:700;
    font-size:12px;
}

.nav-line-bottom{
    height:1px;
    background:rgba(255,215,0,0.3);
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

</style>
</head>

<body>

<div class="title">HIRAGANA CHART 🇯🇵</div>
