<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- 🚫 ZOOM DISABLE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hiragana Chart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* 🚫 BLOCK EVERYTHING */
*{
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#0b0b0b;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Poppins', sans-serif;

    /* 🚫 mobile long press */
    -webkit-touch-callout:none;
}

/* 3:4 FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER ANIMATION */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:700;
    margin-top:15px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* CONTENT */
.content{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    text-align:center;
}

td{
    border:1px solid rgba(184,134,11,0.6);
    padding:10px;
}

/* JAPANESE */
.jp{
    font-size:20px;
    font-weight:700;
    color:#fff;
}

/* ROMAJI */
.rm{
    font-size:10px;
    color:#b8860b;
}

/* NAV */
.bottom-nav{
    width:360px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
}

.nav-btn{
    color:red;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
}

.center{
    color:#b8860b;
    font-weight:700;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

</style>
</head>

<body oncontextmenu="return false">
