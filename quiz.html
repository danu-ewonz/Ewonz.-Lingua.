<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Center</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

body{
    background:#0b0b0b;
    font-family:Poppins;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:borderMove 3s linear infinite;
    z-index:0;
}

.frame::after{
    content:"";
    position:absolute;
    inset:2px;
    background:#0a0a0a;
    border-radius:18px;
    z-index:1;
}

/* CONTENT */
.content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100%;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#fff;
    margin-top:18px;
    letter-spacing:1px;
    text-transform:uppercase;
}

/* SUBTITLE */
.subtitle{
    text-align:center;
    font-size:12px;
    color:#b8860b;
    margin-top:5px;
    font-weight:600;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:10px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* SCROLL AREA */
.grid{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
}

/* BUTTON */
.btn{
    padding:15px;
    border-radius:10px;
    background:#111;
    color:#fff;

    font-size:13px;
    font-weight:600;

    display:flex;
    justify-content:center;
    align-items:center;

    border:2px solid #b8860b;
    cursor:pointer;
    transition:0.25s;
    letter-spacing:1px;
    text-transform:uppercase;
}

.btn:active{
    background:#ffd700;
    color:#000;
    transform:scale(0.97);
}

/* SCROLLBAR */
.grid::-webkit-scrollbar{
    width:3px;
}

.grid::-webkit-scrollbar-thumb{
    background:#b8860b;
}

/* =========================
LOCKED NAV SYSTEM
========================= */
.bottom-nav{
    width:360px;
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 15px;

    background:#0a0a0a;
    border-radius:12px;

    border:1px solid rgba(255,215,0,0.15);
}

/* ITEMS */
.nav-item,
.nav-center{
    flex:1;
    text-align:center;

    font-weight:700;
    letter-spacing:1px;
    white-space:nowrap;
}

/* SIDE BUTTONS */
.nav-item{
    color:#ff3b3b;
    font-size:13px;
    cursor:pointer;
    transition:0.2s ease;
}

/* CENTER */
.nav-center{
    color:#ffd700;
    font-size:12px;
}

/* TOUCH EFFECT */
.nav-item:active{
    color:#ffd700;
    transform:scale(0.95);
}

/* ANIMATION */
@keyframes borderMove{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="content">

    <div class="title">QUIZ CENTER</div>
    <div class="subtitle">PRACTICE & IMPROVE</div>

    <div class="line"></div>

    <div class="grid">

        <div class="btn">BASIC QUIZ</div>
        <div class="btn">JLPT LEVEL QUIZZES</div>
        <div class="btn">GRAMMAR QUIZZES</div>
        <div class="btn">TRANSLATION QUIZZES</div>
        <div class="btn">CHALLENGE MODE</div>
        <div class="btn">PROGRESS SYSTEM</div>

    </div>

</div>

</div>

<!-- OUTSIDE NAV -->
<div class="bottom-nav">

    <div class="nav-item" onclick="history.back()">
        BACK
    </div>

    <div class="nav-center">
        ← EWONZ LINGUA →
    </div>

    <div class="nav-item" onclick="location.href='index.html'">
        HOME
    </div>

</div>

</body>
</html>
