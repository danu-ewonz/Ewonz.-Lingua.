<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Japanese Language</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

/* BODY */
body{
    background-color:black
    background-size:cover;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    font-family:Poppins,sans-serif;
}

/* FRAME */
.frame{
    width:360px;
    aspect-ratio:9/16;
    background:url("1781280284862_edit_59411736612386.png") center center no-repeat;
    background-size:cover;

    border-radius:20px;
    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;
}

/* DARK */
.frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:1;
}

/* BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    z-index:3;
    pointer-events:none;
}

/* CONTENT */
.title,.line,.grid,.bottom-nav{
    position:relative;
    z-index:2;
}

/* TITLE */
.title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#fff;
    margin-top:16px;
}

/* LINE */
.line{
    width:85%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    flex:1;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* BUTTON */
.btn{
    padding:20px 14px;
    border-radius:10px;
    background:rgba(0,0,0,0.6);
    border:2px solid #b8860b;

    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-size:16px;
    font-weight:700;
    text-align: center;

    text-transform:uppercase;
    letter-spacing:1px;

    cursor:pointer;
    position:relative;
}

.btn:active{
    background:#b8860b;
    color:#000;
}

/* LOCK */
.lock-tag{
    position:absolute;
    right:10px;
    top:8px;
    font-size:9px;
    background:red;
    color:#fff;
    padding:2px 6px;
    border-radius:4px;
    font-weight:700;
}

/* NAV (CLEAN TEXT STYLE) */
.bottom-nav{
    height:55px;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 14px;
    background:#0a0a0a;
    border-top:1px solid rgba(255,215,0,0.2);
}

.nav-btn{
    width:70px;
    text-align:center;
    color:#ff3b3b;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}

.nav-btn:active{
    color:#ffd700;
}

.nav-center{
    flex:1;
    text-align:center;
    color:#ffd700;
    font-weight:700;
    font-size:13px;
}

/* POPUP */
.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);

    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-box{
    width:290px;
    background:#111;
    padding:18px;
    border-radius:12px;
    border:2px solid #b8860b;
    text-align:center;
    color:#fff;
}

.popup-box h3{
    color:red;
    margin-bottom:6px;
}

.popup-box .lang{
    color:#fff;
    font-weight:700;
    margin-bottom:6px;
}

.popup-box .date{
    color:#ffd700;
    font-weight:700;
    margin-bottom:6px;
}

.popup-box .countdown{
    color:#fff;
    font-weight:700;
    margin-bottom:10px;
}

.close-btn{
    padding:8px 14px;
    background:#b8860b;
    border:none;
    font-weight:700;
    cursor:pointer;
}

@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">JAPANESE LANGUAGE</div>
<div class="line"></div>

<div class="grid">

    <div class="btn" onclick="go('writing-system.html')">Writing System</div>
    <div class="btn" onclick="go('learning-system.html')">Learning System</div>
    <div class="btn" onclick="go('vocabulary.html')">Vocabulary</div>

    <div class="btn" onclick="openPopup('Grammar')">
        Grammar
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn" onclick="openPopup('Reading Practice')">
        Reading Practice
        <div class="lock-tag">LOCK</div>
    </div>

    <div class="btn" onclick="go('exam.html')">Exam</div>

    <div class="btn" onclick="openPopup('Quiz Center')">
        Quiz Center
        <div class="lock-tag">LOCK</div>
    </div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">BACK</div>
    <div class="nav-center">← EWONZ LINGUA →</div>
    <div class="nav-btn" onclick="location.href='index.html'">HOME</div>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

<div class="popup-box">
    <h3>LOCKED</h3>
    <div class="lang" id="langName">Language Coming Soon</div>
    <div class="date">2026 / 11 / 28</div>
    <div class="countdown" id="countdown">Loading...</div>

    <button class="close-btn" onclick="closePopup()">CLOSE</button>
</div>

</div>

<script>

let timer;
const targetDate = new Date("2026-11-28T00:00:00").getTime();

function go(url){
    location.href = url;
}

function openPopup(name){
    document.getElementById("popup").style.display = "flex";
    document.getElementById("langName").innerText = name + " Language Coming Soon";

    updateCountdown();
    clearInterval(timer);
    timer = setInterval(updateCountdown, 1000);
}

function updateCountdown(){

    const now = new Date().getTime();
    const diff = targetDate - now;

    if(diff <= 0){
        document.getElementById("countdown").innerHTML = "NOW AVAILABLE 🎉";
        clearInterval(timer);
        return;
    }

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    const m = Math.floor((diff%(1000*60*60))/(1000*60));
    const s = Math.floor((diff%(1000*60))/1000);

    document.getElementById("countdown").innerHTML =
        `${d}d ${h}h ${m}m ${s}s`;
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
    clearInterval(timer);
}

</script>

</body>
</html>
