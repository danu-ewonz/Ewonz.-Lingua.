<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Language</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* BLOCK COPY */
*{
    -webkit-user-select:none;
    user-select:none;
}

body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    gap:10px;
}

/* FRAME */
.frame{
    width:360px;
    height:480px;
    background:#0a0a0a;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* GOLD BORDER */
.frame::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:20px;

    background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b,#8b6508,#ffd700);
    background-size:300% 100%;
    animation:shine 3s linear infinite;

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}

/* TITLE */
.title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#e6e6e6;
    margin-top:18px;
}

/* LINE */
.line{
    width:80%;
    height:2px;
    margin:8px auto;
    background:linear-gradient(90deg,transparent,#b8860b,#ffd700,transparent);
}

/* GRID */
.grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px;
    flex:1;
}

/* BUTTON (FONT FIX HERE) */
.btn{
    padding:11px;
    border-radius:10px;
    background:#111;
    color:#fff;

    font-family:'Montserrat', sans-serif; /* 🔥 RESTORED FONT */
    font-size:12px;
    font-weight:600;

    text-align:center;
    border:2px solid #b8860b;
    cursor:pointer;

    text-transform:uppercase;
    letter-spacing:1px;
}

/* NAV */
.bottom-nav{
    width:360px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 5px;
    font-size:13px;
}

/* NAV BUTTONS */
.nav-btn{
    color:red;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

/* CENTER */
.center{
    color:#b8860b;
    font-weight:700;
    letter-spacing:1px;
}

/* ANIMATION */
@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

</style>
</head>

<body>

<div class="frame">

<div class="title">JAPANESE LANGUAGE 🇯🇵</div>
<div class="line"></div>

<div class="grid">

    <div class="btn" onclick="go('learning.html')">Learning System</div>
    <div class="btn" onclick="go('writing.html')">Writing System</div>
    <div class="btn" onclick="go('vocabulary.html')">Vocabulary</div>
    <div class="btn" onclick="go('grammar.html')">Grammar</div>
    <div class="btn" onclick="go('reading.html')">Reading Practice</div>
    <div class="btn" onclick="go('exam.html')">Exam</div>
    <div class="btn" onclick="go('quiz.html')">Quiz Center</div>

</div>

</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-btn" onclick="history.back()">← BACK →</div>

    <div class="center">EWONZ LINGUA</div>

    <div class="nav-btn" onclick="location.href='index.html'">→ HOME →</div>

</div>

<script>
function go(url){
    window.location.href = url;
}
</script>

</body>
</html>
